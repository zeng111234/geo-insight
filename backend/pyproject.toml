[project]
name = "geo-backend"
version = "0.1.0"
description = "GEO Insight backend (MVP slice)"
requires-python = ">=3.12"
# 运行期只依赖这两个包：SQLite 走标准库，前端是静态文件。
# 与 backend/requirements.txt 保持一致。
dependencies = [
    "starlette>=0.41",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
