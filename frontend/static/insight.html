<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/static/theme.css" />
<link rel="stylesheet" href="/static/app.css" />
<script src="/static/app.js"></script>
<title>GEO Insight · AI 舆情</title>
<style>
  .bars { display: grid; gap: 7px; }
  .barrow { display: grid; grid-template-columns: 96px minmax(0, 1fr) 100px; gap: 8px; align-items: center; font-size: var(--fs-label); }
  .barrow > span:last-child { white-space: nowrap; text-align: right; }
  .bartrack { display: block; height: 9px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  /* span 默认 inline，width/height 不生效；必须块化，否则进度条只剩灰色轨道。 */
  .barfill { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .spark { width: 100%; height: 100%; display: block; }
  .concl { margin: 0; padding-left: 18px; display: grid; gap: 9px; font-size: 12.5px; line-height: 1.75; color: var(--text-body); }
  .concl li::marker { color: var(--accent); }
  .concl strong { color: var(--text-strong); }
</style>
</head>
<body>
<div class="shell">
  <main>
    <header class="top">
      <h1>AI 舆情</h1>
      <span class="sub">跨模型横向比较：同一批问题在不同模型里的可见度差异</span>
      <span class="spacer"></span>
      <select id="tracker" aria-label="监控对象"></select>
      <input id="from" type="date" value="2026-11-01" aria-label="开始日期" />
      <input id="to" type="date" value="2026-11-30" aria-label="结束日期" />
      <button id="load" class="primary">查询</button>
    </header>
    <div class="content">
      <div class="notice" id="scopeNote">口径：同一监控对象、同一周期、同一问题集；每个模型独立计算，样本不足按自身分母判断。</div>
      <div class="panel">
        <h2>模型对比 <span class="badge" id="modelMeta">—</span></h2>
        <div class="body"><div class="table-wrap" id="models"><div class="empty">加载中…</div></div></div>
      </div>
      <div class="grid c2">
        <div class="panel">
          <h2>提及率趋势</h2>
          <div class="body fill" id="trend"><div class="empty">加载中…</div></div>
        </div>
        <div class="panel">
          <h2>信源类型分布</h2>
          <div class="body" id="types"><div class="empty">加载中…</div></div>
        </div>
      </div>
      <div class="panel" style="margin-top:14px">
        <h2>本期结论 <span class="badge" id="conclusionMeta">—</span></h2>
        <div class="body" id="conclusions"><div class="empty">加载中…</div></div>
      </div>
      <div class="panel" style="margin-top:14px">
        <h2>分问题表现 <span class="badge" id="byQMeta">—</span></h2>
        <div class="body" id="byQuestion"><div class="empty">加载中…</div></div>
      </div>
    </div>
  </main>
</div>
<script>
(function () {
  var G = window.GEO, $ = G.$, esc = G.esc;

  // /metrics/trend 的字段名是 date，不是 day；缺字段时退回序号，不让整页渲染崩掉。
  function dayLabel(p, i) {
    var raw = p && (p.date || p.day);
    return raw ? String(raw).slice(5) : "#" + (i + 1);
  }

  // null 表示「样本不足」，不是 0%：不画点、不连线，轴上标「—」，避免和结论口径打架。
  // 按容器实际像素尺寸绘图：viewBox 与渲染尺寸 1:1，文字不变形，图表填满面板。
  // 同排面板等高后高度由邻居决定，所以布局稳定后要重绘一次。
  function spark(points) {
    if (!points || !points.length) { $("trend").innerHTML = G.empty("该周期没有趋势数据"); return; }
    var box = $("trend");
    function draw() {
      var cs = getComputedStyle(box);
      var w = Math.max(320, box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
      var h = Math.max(180, box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom));
      box.innerHTML = sparkSVG(points, w, h);
    }
    draw();
    requestAnimationFrame(draw);
    window.addEventListener("resize", draw);
  }

  function sparkSVG(points, W, H) {
    var pad = 18;
    var vals = points.map(function (p) {
      return p.mention_rate === null || p.mention_rate === undefined ? null : p.mention_rate;
    });
    var present = vals.filter(function (v) { return v !== null; });
    if (!present.length) return G.empty("该周期各日样本均不足，不给比率");
    var max = Math.max.apply(null, present.concat([0.1]));
    var step = points.length > 1 ? (W - pad * 2) / (points.length - 1) : 0;
    var coords = points.map(function (p, i) {
      var v = vals[i];
      return {
        x: pad + i * step,
        y: v === null ? null : H - pad - (v / max) * (H - pad * 2),
        label: dayLabel(p, i), value: v, missing: v === null
      };
    });
    // 缺失日不切段：一条连续线跨过缺口，缺失日仍标「—」。切段会让折线看起来像断了。
    var present = coords.filter(function (c) { return !c.missing; });
    var labelEvery = Math.max(1, Math.ceil(points.length / 8));
    var path = present.map(function (c, i) {
      return (i ? "L" : "M") + c.x.toFixed(1) + " " + c.y.toFixed(1);
    }).join(" ");
    var paths = '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2" />';
    var dots = coords.map(function (c, i) {
      if (c.missing) return "";
      // 数值标签抽稀：30 个点每个都标数字会糊成一团，首尾与每 2*labelEvery 点标一次。
      var showVal = (i % (labelEvery * 2) === 0 || i === coords.length - 1);
      return '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="3" fill="var(--accent)"><title>' +
        esc(c.label) + " " + G.pct(c.value) + "</title></circle>" +
        (showVal ? '<text x="' + c.x.toFixed(1) + '" y="' + Math.max(10, c.y - 7).toFixed(1) +
          '" font-size="9" text-anchor="middle" fill="var(--muted)">' + G.pct(c.value) + "</text>" : "");
    }).join("");
    var labels = coords.map(function (c, i) {
      // 缺失日的「—」始终显示（那是口径信号），日期轴按 labelEvery 抽稀。
      if (!(c.missing || i % labelEvery === 0 || i === coords.length - 1)) return "";
      return '<text x="' + c.x.toFixed(1) + '" y="' + (H - 4) +
        '" font-size="10" text-anchor="middle" fill="var(--muted)">' +
        (c.missing ? "—" : esc(c.label)) + "</text>";
    }).join("");
    return '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">' +
      '<line x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) + '" stroke="var(--border)" />' +
      paths + dots + labels + "</svg>";
  }

  function renderModels(rows) {
    if (!rows.length) { $("models").innerHTML = G.empty("没有可比较的模型"); return; }
    $("models").innerHTML = "<table><thead><tr><th>模型</th><th class=\"num\">有效样本</th><th class=\"num\">提及数</th>" +
      "<th class=\"num\">提及率</th><th class=\"num\">平均排名</th><th class=\"num\">Top3</th><th>情感</th></tr></thead><tbody>" +
      rows.map(function (r) {
        var c = r.data.cards, s = c.sentiment;
        return "<tr><td><strong>" + esc(r.model) + "</strong></td>" +
          "<td class=\"num\">" + G.num(r.data.valid_total) + "</td>" +
          "<td class=\"num\">" + G.num(c.mention_count) + "</td>" +
          "<td class=\"num\">" + G.metricText(c.mention_rate) + "</td>" +
          "<td class=\"num\">" + (c.avg_rank.status === "insufficient_samples" ? "样本不足" : G.num(c.avg_rank.value)) + "</td>" +
          "<td class=\"num\">" + G.metricText(c.top3_rate) + "</td>" +
          "<td>" + (s && s.status === "ok" ? "正面 " + G.pct(s.distribution && s.distribution.pos) : "样本不足") + "</td></tr>";
      }).join("") + "</tbody></table>";
    $("modelMeta").textContent = rows.length + " 个模型";
  }

  function renderTypes(cite) {
    var rows = cite.by_type || [];
    if (!rows.length) { $("types").innerHTML = G.empty("该周期没有引用记录"); return; }
    $("types").innerHTML = '<div class="bars">' + rows.map(function (r) {
      var w = Math.round((r.share || 0) * 100);
      return '<div class="barrow"><span>' + esc(r.media_type) + '</span>' +
        '<span class="bartrack"><span class="barfill" style="width:' + w + '%"></span></span>' +
        '<span class="mono">' + G.num(r.count) + " · " + G.pct(r.share) + "</span></div>";
    }).join("") + "</div>" +
      '<div class="notice warn" style="margin-top:12px">视频引用占比 ' + G.pct(cite.video_share) +
      " · 发布时间未知占比 " + G.pct(cite.unknown_published_share) + "（未知占比过高时，时间分布不作结论）</div>";
  }

  // 结论全部从本页已取到的三个接口推导，不写死数字，也不把「样本不足」说成涨跌。
  function renderConclusions(results, trend, cite) {
    var lines = [];
    var ok = results.filter(function (r) {
      var m = r.data && r.data.cards && r.data.cards.mention_rate;
      return m && m.status === "ok" && m.value !== null && m.value !== undefined;
    });
    if (ok.length >= 2) {
      var sorted = ok.slice().sort(function (a, b) {
        return b.data.cards.mention_rate.value - a.data.cards.mention_rate.value;
      });
      var hi = sorted[0], lo = sorted[sorted.length - 1];
      var hv = hi.data.cards.mention_rate.value, lv = lo.data.cards.mention_rate.value;
      lines.push("提及率最高 <strong>" + esc(hi.model) + "</strong> " + G.pct(hv) +
        "，最低 <strong>" + esc(lo.model) + "</strong> " + G.pct(lv) +
        "，相差 " + ((hv - lv) * 100).toFixed(1) + " pp。差异只描述本周期样本，不等于模型偏好。");
    } else {
      lines.push("本周期共 " + results.length + " 个模型，其中 " + ok.length +
        " 个达到提及率的样本门槛；未达门槛的模型不输出比率，也不参与横向排名。");
    }
    var thin = results.filter(function (r) {
      var c = r.data && r.data.cards;
      if (!c) return false;
      return ["coverage_rate", "avg_rank", "top1_rate", "top3_rate", "top10_rate", "sentiment"]
        .some(function (k) { return c[k] && c[k].status === "insufficient_samples"; });
    });
    if (thin.length) {
      lines.push(thin.length + " 个模型的排名/情感类指标显示「样本不足」：这些分母只取带推荐列表位次或已提及的样本，样本 &lt; 3 不给数字，详见首页「口径说明」。");
    }
    var pts = (trend && trend.points) || [];
    if (pts.length >= 2) {
      var first = pts[0], last = pts[pts.length - 1];
      lines.push("趋势按日聚合 " + pts.length + " 天，有效样本合计 " +
        pts.reduce(function (s, p) { return s + (p.valid_total || 0); }, 0) + " 条；" +
        (last.mention_rate === null || last.mention_rate === undefined
          ? "末日样本不足，不给比率。"
          : "末日提及率 " + G.pct(last.mention_rate) + "（首日 " +
            (first.mention_rate === null || first.mention_rate === undefined ? "样本不足" : G.pct(first.mention_rate)) + "）。"));
    }
    if (cite && cite.by_type && cite.by_type.length) {
      lines.push("引用按媒体类型分布：" + cite.by_type.map(function (r) {
        return esc(r.media_type) + " " + G.pct(r.share);
      }).join(" · ") + "；视频占比 " + G.pct(cite.video_share) +
        "，发布时间未知占比 " + G.pct(cite.unknown_published_share) + "。");
    }
    $("conclusionMeta").textContent = lines.length + " 条";
    $("conclusions").innerHTML = '<ul class="concl">' +
      lines.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>";
  }

  // 按问题聚合已取到的样本，把页面下半部分填满，也方便看出「哪个问题最拖后腿」。
  function renderByQuestion(data) {
    var items = (data.items || []).filter(function (x) { return x.in_denominator; });
    var byQ = {};
    items.forEach(function (x) {
      var k = x.question_id || x.question_text;
      if (!byQ[k]) byQ[k] = { text: x.question_text, tier: x.tier, total: 0, hit: 0, models: {} };
      byQ[k].total += 1;
      if (x.mentioned) byQ[k].hit += 1;
      var m = byQ[k].models[x.model_key] || { total: 0, hit: 0 };
      m.total += 1;
      if (x.mentioned) m.hit += 1;
      byQ[k].models[x.model_key] = m;
    });
    var rows = Object.keys(byQ).map(function (k) { return byQ[k]; });
    $("byQMeta").textContent = rows.length + " 个问题";
    if (!rows.length) { $("byQuestion").innerHTML = G.empty("当前周期没有计入分母的样本"); return; }
    var pg = G.pagerSlice("byQuestion", rows, function () { renderByQuestion(data); });
    $("byQuestion").innerHTML = '<div class="table-wrap"><table><thead><tr><th>问题</th><th>层级</th>' +
      '<th class="num">样本</th><th class="num">提及</th><th class="num">提及率</th>' +
      "<th>各模型「提及 / 样本」</th></tr></thead><tbody>" +
      pg.slice.map(function (r) {
        return "<tr><td>" + esc(r.text) + "</td><td>" +
          '<span class="tag ' + (r.tier === "core" ? "core" : "") + '">' +
          (r.tier === "core" ? "核心" : "长尾") + "</span></td>" +
          '<td class="num">' + G.num(r.total) + "</td>" +
          '<td class="num">' + G.num(r.hit) + "</td>" +
          '<td class="num">' + G.pct(r.total ? r.hit / r.total : null) + "</td><td>" +
          Object.keys(r.models).map(function (m) {
            var v = r.models[m];
            return esc(m) + " " + v.hit + "/" + v.total;
          }).join(" · ") + "</td></tr>";
      }).join("") + "</tbody></table></div>" + pg.nav +
      '<div class="notice" style="margin-top:10px">只统计计入提及率分母的样本；无列表提及会出现在答案里，但不进平均排名分母。</div>';
  }

  async function load() {
    var t = G.tracker(); if (!t) return;
    G.pagerReset("byQuestion");
    var q = G.dates();
    var plan = await G.get("/trackers/" + t + "/sampling-plan").catch(function () { return { models: [] }; });
    var models = (plan.models && plan.models.length) ? plan.models : ["doubao", "deepseek", "kimi"];
    var out = { models: null, trend: null, cite: null };

    // 每个面板单独兜底：一个接口或渲染出错，不把其它面板一起刷成报错。
    function done() {
      if (out.models && out.trend && out.cite) {
        try { renderConclusions(out.models, out.trend, out.cite); }
        catch (e) { G.fail(e, ["conclusions"]); }
      }
    }

    await Promise.all([
      Promise.all(models.map(function (m) {
        return G.get("/trackers/" + t + "/metrics/overview?" + q + "&model=" + encodeURIComponent(m))
          .then(function (data) { return { model: m, data: data }; });
      })).then(function (rows) {
        out.models = rows; renderModels(rows); done();
      }).catch(function (e) { G.fail(e, ["models"]); }),

      G.get("/trackers/" + t + "/metrics/trend?" + q).then(function (d) {
        out.trend = d; spark(d.points); done();
      }).catch(function (e) { G.fail(e, ["trend"]); }),

      G.get("/trackers/" + t + "/citations/summary?" + q).then(function (d) {
        out.cite = d; renderTypes(d); done();
      }).catch(function (e) { G.fail(e, ["types"]); }),

      G.get("/trackers/" + t + "/metrics/mention_rate/samples?" + q).then(renderByQuestion)
        .catch(function (e) { G.fail(e, ["byQuestion"]); })
    ]);

    if (!(out.models && out.trend && out.cite)) {
      $("conclusionMeta").textContent = "—";
      $("conclusions").innerHTML = G.empty("部分接口未返回，结论暂不生成");
    }
  }

  $("load").addEventListener("click", load);
  (async function () { await G.fillTrackers(); await load(); })();
})();
</script>
</body>
</html>
