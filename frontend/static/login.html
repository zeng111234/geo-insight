<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · GEO Insight</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/app.css">
<style>
  .login-body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
  .login-card { width: 320px; padding: 26px 24px 22px; }
  .login-card h1 { font-size: 17px; margin: 0 0 2px; color: var(--text-strong); }
  .login-card .sub { margin: 0 0 18px; font-size: 12px; color: var(--muted); }
  .login-card label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .login-card input[type="email"], .login-card input[type="password"] { width: 100%; margin-top: 5px; }
  .login-card button { width: 100%; margin-top: 4px; }
  .login-error { margin: 0 0 14px; padding: 7px 10px; border-radius: 6px; font-size: 12px;
    color: var(--red-ink); background: var(--red-tint); border: 1px solid var(--red-line); }
  .login-hint { margin: 14px 0 0; font-size: 11px; line-height: 1.6; color: var(--muted); }
</style>
</head>
<body class="login-body">
<main class="login-card panel">
  <h1>GEO Insight</h1>
  <p class="sub">品牌在 AI 答案中的可见度监测</p>
  {{error}}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{next}}">
    <label>邮箱
      <input type="email" name="email" value="{{email}}" required autocomplete="username">
    </label>
    <label>密码
      <input type="password" name="password" required autocomplete="current-password" autofocus>
    </label>
    <button class="primary" type="submit">登录</button>
  </form>
  <p class="login-hint">
    演示账号已预填，密码在启动日志与 README 里；可用环境变量 <code>GEO_ADMIN_PASSWORD</code> 覆盖。
    服务重启后需要重新登录。
  </p>
</main>
</body>
</html>
