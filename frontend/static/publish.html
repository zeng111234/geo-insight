<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/static/theme.css" />
<link rel="stylesheet" href="/static/app.css" />
<script src="/static/app.js"></script>
<title>GEO Insight · 任务发布</title>
<style>
  .pub-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--border); }
  .pub-row:last-child { border-bottom: none; }
  .imp { border-bottom: 1px solid var(--border); padding: 11px 14px; }
  .imp:last-child { border-bottom: none; }
  .imp .h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
  .imp .t { font-size: 12.5px; font-weight: 500; }
  .imp .m { font-size: 11px; color: var(--muted); }
  .delta { font-size: 13px; font-weight: 600; }
  .delta.up { color: var(--green-ink); }
  .delta.down { color: var(--red-ink); }
  .delta.flat { color: var(--muted); }
  .imp .scope { font-size: 11px; color: var(--text-body); margin-top: 3px; }
  .imp .table-wrap { margin-top: 7px; border: 1px solid var(--border); border-radius: 7px; }
  .imp table { font-size: 11px; }
  .imp th, .imp td { padding: 4px 7px; }
  .imp .hit { font-size: 11px; margin-top: 7px; color: var(--text-body); line-height: 1.7; }
  .imp .hit a { color: var(--accent-ink); text-decoration: none; }
  .imp .hit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="shell">
  <main>
    <header class="top">
      <h1>任务发布</h1>
      <span class="sub">发布记录、渠道状态与发布前后效果对比</span>
      <span class="spacer"></span>
      <select id="tracker" aria-label="监控对象"></select>
      <button id="load" class="primary">刷新</button>
      <a class="btn" href="/tasks">看创作进度 →</a>
    </header>
    <div class="content">
      <div class="notice">渠道连接与发布走<strong>真实链路</strong>（浏览器自动化，决策 011）：连接/检测在内容工作室发起，此处为只读镜像。效果对比只描述采样结果，不构成因果承诺。</div>
      <div class="cards" id="stats"></div>

      <div class="panel" style="margin-top:14px">
        <h2>发布记录 <span class="badge" id="pubMeta">—</span></h2>
        <div id="pubs"><div class="empty">加载中…</div></div>
      </div>

      <div class="grid c2" style="margin-top:14px">
        <div class="panel">
          <h2>渠道状态 <span class="badge" id="chMeta">—</span></h2>
          <div class="body" id="channels"><div class="empty">加载中…</div></div>
        </div>
        <div class="panel">
          <h2>发布前后效果对比
            <select id="impactWindow" aria-label="对比窗口"
              style="font-size:11px;padding:2px 4px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text)">
              <option value="7">7 天</option>
              <option value="14" selected>14 天</option>
              <option value="30">30 天</option>
            </select>
            <span class="badge" id="impMeta">—</span>
          </h2>
          <div id="impact"><div class="empty">加载中…</div></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
(function () {
  var G = window.GEO, $ = G.$, esc = G.esc;
  var state = { impactWindow: 14 };
  var stat = function (l, v, s) {
    return '<div class="card"><div class="label">' + esc(l) + '</div><div class="value">' + esc(v) + '</div><div class="sub">' + esc(s) + "</div></div>";
  };
  var PUB_TEXT = {
    queued: "排队中", running: "发布中…", published: "已发布",
    draft_saved: "已存草稿", blocked: "被平台拦", failed: "失败", unknown: "待人工确认",
  };
  var CH_TEXT = {
    connected: "已连接", disconnected: "未连接", expired: "已过期",
    connecting: "登录中", needs_config: "待配置密钥", not_implemented: "未接入",
  };
  var CH_TAG = { connected: "ok", expired: "warn", disconnected: "", connecting: "warn" };
  var LOGIN_TEXT = { scan_qr: "扫码登录", oauth: "OAuth 授权", password: "账号密码", browser: "浏览器登录态", api: "API 密钥" };

  function renderStats(rows, channels) {
    var pubs = [];
    rows.forEach(function (r) { (r.publications || []).forEach(function (p) { pubs.push({ r: r, p: p }); }); });
    var okCount = pubs.filter(function (x) { return x.p.status === "published"; }).length;
    var connected = channels.filter(function (c) { return c.status === "connected"; }).length;
    var deltas = rows.filter(function (r) { return r.impact && r.impact.comparable === true && typeof r.impact.delta_pp === "number"; })
      .map(function (r) { return r.impact.delta_pp; });
    var avgDelta = deltas.length ? deltas.reduce(function (a, b) { return a + b; }, 0) / deltas.length : null;
    $("stats").innerHTML =
      stat("发布记录", pubs.length, "其中成功 " + okCount + " 条") +
      stat("已连接渠道", connected + " / " + channels.length, "过期与未连接不能直接发帖") +
      stat("有发布记录的文章", rows.filter(function (r) { return (r.publications || []).length; }).length, "共 " + rows.length + " 篇文章") +
      stat("发布后平均提及率变化", avgDelta === null ? "—" : (avgDelta > 0 ? "+" : "") + avgDelta.toFixed(1) + "pp",
        deltas.length ? deltas.length + " 个可比窗口" : "暂无可比窗口");
  }

  function renderPubs(rows) {
    var pubs = [];
    rows.forEach(function (r) { (r.publications || []).forEach(function (p) { pubs.push({ r: r, p: p }); }); });
    $("pubMeta").textContent = pubs.length + " 条";
    if (!pubs.length) {
      $("pubs").innerHTML = G.empty("还没有发布记录，可在内容工作室勾选已连接渠道发起发布");
      return;
    }
    $("pubs").innerHTML = pubs.map(function (x) {
      var p = x.p;
      return '<div class="pub-row"><span class="tag">' + esc(p.platform_name || p.platform_key) + "</span>" +
        '<span class="tag ' + (p.status === "published" || p.status === "draft_saved" ? "ok" : p.status === "failed" || p.status === "blocked" ? "bad" : "warn") + '">' +
        esc(PUB_TEXT[p.status] || p.status) + "</span>" +
        '<span class="muted">' + esc(x.r.title) + "</span>" +
        '<span class="spacer"></span>' +
        '<span class="muted">' + esc((p.published_at || "").slice(0, 16).replace("T", " ")) + "</span>" +
        (p.published_url ? '<a class="plain" href="' + esc(p.published_url) + '" target="_blank" rel="noreferrer">回链 →</a>'
                         : '<span class="muted">无回链</span>') +
        (p.failure_reason ? '<span class="tag bad">' + esc(p.failure_reason) + "</span>" : "") + "</div>";
    }).join("");
  }

  function renderChannels(channels) {
    $("chMeta").textContent = channels.length + " 个渠道";
    $("channels").innerHTML = '<div class="table-wrap"><table><thead><tr><th>渠道</th><th>状态</th>' +
      "<th>登录方式</th><th>检测附注</th><th class=\"nowrap\">最后检查</th></tr></thead><tbody>" +
      channels.map(function (c) {
        return "<tr><td>" + esc(c.platform_name) + "</td><td>" +
          '<span class="tag ' + (CH_TAG[c.status] || "") + '">' + esc(CH_TEXT[c.status] || c.status) + "</span></td>" +
          "<td>" + esc(LOGIN_TEXT[c.login_mode] || "—") + "</td>" +
          '<td class="muted" style="max-width:260px;word-break:break-all">' + esc(c.last_check_note || "—") + "</td>" +
          '<td class="nowrap">' + esc((c.last_checked_at || "").slice(0, 16).replace("T", " ") || "—") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function rateText(window) {
    if (!window || !window.mention_rate) return "—";
    if (window.mention_rate.status !== "ok") return "样本不足";
    return G.pct(window.mention_rate.value) + "（" + window.mention_total + "/" + window.valid_total + "）";
  }

  function deltaText(value) {
    if (value === null || value === undefined) return "—";
    return (value > 0 ? "+" : "") + value.toFixed(1) + "pp";
  }

  function deltaCls(value) {
    return value === null || value === undefined ? "flat" : value > 0 ? "up" : value < 0 ? "down" : "flat";
  }

  function renderImpact(rows) {
    var list = rows.filter(function (r) { return r.impact && r.impact.status === "ok"; });
    $("impMeta").textContent = list.length + " 篇有对比";
    if (!list.length) { $("impact").innerHTML = G.empty("还没有可对比的发布效果"); return; }
    $("impact").innerHTML = list.map(function (r) {
      var im = r.impact;
      var d = im.delta_pp;
      var scopeText = im.scope === "question" && im.question
        ? "目标问题：" + esc(im.question.text) + "（发布前 " + im.before.valid_total + " 条 / 发布后 " + im.after.valid_total + " 条）"
        : "口径：全对象（文章未绑定问题）";

      var modelRows = (im.by_model || []).map(function (m) {
        return "<tr><td>" + esc(m.model_key) + "</td>" +
          '<td class="num">' + esc(rateText(m.before)) + "</td>" +
          '<td class="num">' + esc(rateText(m.after)) + "</td>" +
          '<td class="num"><span class="delta ' + deltaCls(m.delta_pp) + '" style="font-size:11px">' +
          esc(deltaText(m.delta_pp)) + "</span></td>" +
          '<td class="num">' + (m.citations_matched ? G.num(m.citations_matched) : "—") + "</td></tr>";
      }).join("");
      var modelTable = modelRows
        ? '<div class="table-wrap"><table><thead><tr><th>模型</th><th class="num">发布前</th>' +
          '<th class="num">发布后</th><th class="num">变化</th><th class="num">引用命中</th></tr></thead><tbody>' +
          modelRows + "</tbody></table></div>"
        : "";

      var hit = im.citation_match || {};
      var afterHit = hit.after || {};
      var beforeHit = hit.before || {};
      var hitText = "AI 引用我方文章：发布后 " + (afterHit.matched_count || 0) + " 次 / " +
        (afterHit.matched_answers || 0) + " 条答案（发布前 " + (beforeHit.matched_count || 0) + " 次）";
      var samples = (afterHit.samples || []).slice(0, 3).map(function (s) {
        return '<a href="' + esc(s.url) + '" target="_blank" rel="noreferrer">' +
          esc(s.title || s.domain || s.url) + "</a> " +
          '<span class="muted">' + esc(s.model_key) + " · " +
          esc(String(s.collected_at).slice(0, 16).replace("T", " ")) + "</span>";
      }).join("<br />");

      var controlText = "";
      if (im.control) {
        var c = im.control;
        controlText = '<div class="m" style="margin-top:5px">对照问题「' + esc(c.question_text || c.question_id) + "」" +
          "：发布前 " + esc(rateText(c.before)) + " → 发布后 " + esc(rateText(c.after)) +
          "，变化 " + esc(deltaText(c.delta_pp)) +
          (im.did_pp === null || im.did_pp === undefined ? "" : "；净变化（DiD）" + esc(deltaText(im.did_pp))) +
          "</div>";
      }

      return '<div class="imp"><div class="h"><span class="t">' + esc(r.title) + "</span>" +
        '<span class="tag ' + (im.comparable === true ? "ok" : "warn") + '">' +
        (im.comparable === true ? "可比" : "不可比") + "</span>" +
        '<span class="muted">窗口 ' + esc(im.window_days) + " 天 · " + esc((im.channels || []).join("、")) + "</span>" +
        '<span class="spacer"></span><span class="delta ' + deltaCls(d) + '">' + esc(deltaText(d)) + "</span></div>" +
        '<div class="scope">' + esc(scopeText) + "</div>" +
        '<div class="m">发布前 ' + esc(im.before.from) + " ~ " + esc(im.before.to) +
        " 提及率 " + esc(rateText(im.before)) +
        " · 发布后 " + esc(im.after.from) + " ~ " + esc(im.after.to) +
        " 提及率 " + esc(rateText(im.after)) + "</div>" +
        modelTable +
        '<div class="hit">' + esc(hitText) + (samples ? "<br />" + samples : "") + "</div>" +
        controlText +
        ((im.notes || []).length ? '<div class="m" style="margin-top:5px">说明：' + esc(im.notes.join("；")) + "</div>" : "") +
        "</div>";
    }).join("");
  }

  async function load() {
    var t = G.tracker(); if (!t) return;
    try {
      var pair = await Promise.all([
        G.get("/trackers/" + t + "/articles"),
        G.get("/channels")
      ]);
      var items = (pair[0].items || []);
      var channels = pair[1].items || [];
      var rows = await Promise.all(items.map(function (a) {
        return Promise.all([
          G.get("/articles/" + a.id).catch(function () { return null; }),
          G.get("/articles/" + a.id + "/impact?windowDays=" + state.impactWindow + "&scope=question").catch(function () { return null; })
        ]).then(function (d) {
          return { article: a, title: a.title, publications: (d[0] && d[0].publications) || [], impact: d[1] };
        });
      }));
      renderStats(rows, channels);
      renderPubs(rows);
      renderChannels(channels);
      renderImpact(rows);
    } catch (e) { G.fail(e, ["stats", "pubs", "channels", "impact"]); }
  }

  $("impactWindow").addEventListener("change", function () {
    state.impactWindow = parseInt(this.value, 10) || 14;
    load();
  });
  $("load").addEventListener("click", load);
  (async function () { await G.fillTrackers(); await load(); })();
})();
</script>
</body>
</html>
