<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/static/theme.css" />
<link rel="stylesheet" href="/static/app.css" />
<script src="/static/app.js"></script>
<title>GEO Insight · 优化任务</title>
<style>
  .kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
  @media (max-width: 980px) { .kanban { grid-template-columns: 1fr; } }
  .kcol { min-height: 120px; display: flex; flex-direction: column; }
  .kcol > .badge { margin-left: auto; }
  .kcard { border: 1px solid var(--border); border-radius: 8px; padding: 10px 11px; margin: 10px; background: var(--subtle); flex: none; }
  .kcard .t { font-size: 12.5px; font-weight: 500; margin-bottom: 7px; }
  .kcard .m { display: flex; flex-wrap: wrap; gap: 6px; font-size: var(--fs-caption); color: var(--muted); }
  .pub-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); }
  .pub-row:last-child { border-bottom: none; }
</style>
</head>
<body>
<div class="shell">
  <main>
    <header class="top">
      <h1>优化任务</h1>
      <span class="sub">文章从草稿到发布的进度，以及发布记录</span>
      <span class="spacer"></span>
      <select id="tracker" aria-label="监控对象"></select>
      <button id="load" class="primary">刷新</button>
      <a class="btn" href="/studio">进入工作室 →</a>
    </header>
    <div class="content">
      <div class="notice">发布走<strong>真实链路</strong>（浏览器自动化，决策 011）：渠道连接与发布发起都在内容工作室，此处跟踪六阶段进度与发布结果。</div>
      <div class="kanban" id="kanban"><div class="empty">加载中…</div></div>
      <div class="panel" id="publications" style="margin-top:14px">
        <h2>发布记录 <span class="badge" id="pubMeta">—</span></h2>
        <div id="pubs"></div>
      </div>
      <div class="panel" style="margin-top:14px">
        <h2>文章明细 <span class="badge" id="articleMeta">—</span></h2>
        <div class="body" id="articleTable"><div class="empty">加载中…</div></div>
      </div>
    </div>
  </main>
</div>
<script>
(function () {
  var G = window.GEO, $ = G.$, esc = G.esc;
  var COLS = [
    { key: "draft", name: "草稿", tag: "" },
    { key: "review", name: "待审", tag: "warn" },
    { key: "published", name: "已发布", tag: "ok" }
  ];
  // 真实浏览器发布器执行的状态；不叫「演示态」也不吹「已发布」——
  // 库里 published 多为种子假链接，有效回链按 URL 另判（见下）。
  var PUB_TEXT = { queued: "待发布", published: "已发布", failed: "失败", blocked: "被平台拦截" };
  // 只有 http(s) 且不是种子 demo-article 假链的才算有效回链。
  function isValidUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) && !/demo-article/i.test(u);
  }
  var STATUS_TEXT = { draft: "草稿", review: "待审", published: "已发布" };

  function renderArticles(items) {
    $("articleMeta").textContent = items.length + " 篇";
    if (!items.length) { $("articleTable").innerHTML = G.empty("还没有文章，可在内容工作室新建"); return; }
    $("articleTable").innerHTML = '<div class="table-wrap"><table><thead><tr><th>标题</th><th>状态</th>' +
      '<th class="num">版本</th><th class="num">事实核实</th><th>优化目标</th>' +
      '<th class="num">发布记录</th><th class="nowrap">更新时间</th></tr></thead><tbody>' +
      items.map(function (a) {
        var pending = a.fact_pending || 0, done = (a.fact_total || 0) - pending;
        return "<tr><td>" + esc(a.title) + "</td><td>" +
          '<span class="tag ' + (a.status === "published" ? "ok" : a.status === "review" ? "warn" : "") + '">' +
          esc(STATUS_TEXT[a.status] || a.status) + "</span></td>" +
          '<td class="num">v' + G.num(a.version) + "</td>" +
          '<td class="num">' + (pending ? '<span class="tag warn">' + done + " / " + G.num(a.fact_total) + "</span>"
                                  : '<span class="tag ok">' + done + " / " + G.num(a.fact_total) + "</span>") + "</td>" +
          '<td class="muted" title="' + esc(a.goal || "") + '">' + esc((a.goal || "—").slice(0, 34)) +
          ((a.goal || "").length > 34 ? "…" : "") + "</td>" +
          '<td class="num">' + G.num(a.publication_total) + "</td>" +
          '<td class="nowrap">' + esc((a.updated_at || "").slice(0, 16).replace("T", " ")) + "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      '<div class="notice" style="margin-top:10px">「事实核实」为已确认 / 事实总数；待核实的条目会在内容工作室标出，未核实不进入发布态。</div>';
  }

  function card(a) {
    return '<div class="kcard"><div class="t"><a class="plain" href="/studio">' + esc(a.title) + "</a></div>" +
      '<div class="m"><span class="tag">v' + G.num(a.version) + "</span>" +
      (a.fact_pending ? '<span class="tag warn">待核实 ' + G.num(a.fact_pending) + "</span>"
                      : '<span class="tag ok">事实已确认</span>') +
      "<span>发布 " + G.num(a.publication_total) + " 条</span></div></div>";
  }

  async function load() {
    var t = G.tracker(); if (!t) return;
    try {
      var d = await G.get("/trackers/" + t + "/articles");
      var items = d.items || [];
      renderArticles(items);
      $("kanban").innerHTML = COLS.map(function (c) {
        var list = items.filter(function (a) { return a.status === c.key; });
        return '<div class="panel kcol"><h2>' + esc(c.name) + ' <span class="badge">' + list.length + " 篇</span></h2>" +
          (list.length ? list.map(card).join("") : G.empty("暂无")) + "</div>";
      }).join("");

      var details = await Promise.all(items.map(function (a) {
        return G.get("/articles/" + a.id).catch(function () { return null; });
      }));
      var pubs = [];
      details.forEach(function (d2, i) {
        if (!d2) return;
        (d2.publications || []).forEach(function (p) {
          pubs.push({ title: items[i].title, p: p });
        });
      });
      $("pubMeta").textContent = pubs.length + " 条记录";
      $("pubs").innerHTML = pubs.length ? pubs.map(function (x) {
        var p = x.p;
        return '<div class="pub-row"><span class="tag">' + esc(p.platform_name) + "</span>" +
          '<span class="tag ' + (p.status === "published" ? "ok" : "") + '">' + esc(PUB_TEXT[p.status] || p.status) + "</span>" +
          '<span class="muted">' + esc(x.title.slice(0, 30)) + "</span><span class=\"spacer\"></span>" +
          (isValidUrl(p.published_url) ? '<a class="plain" href="' + esc(p.published_url) + '" target="_blank" rel="noreferrer">回链 →</a>'
                           : '<span class="muted">无有效回链（未真发或为演示链接）</span>') + "</div>";
      }).join("") : G.empty("还没有发布记录，可在内容工作室点「一键发布」发起真实发布");
    } catch (e) { G.fail(e, ["kanban", "pubs", "articleTable"]); }
  }

  $("load").addEventListener("click", load);
  (async function () { await G.fillTrackers(); await load(); })();
})();
</script>
</body>
</html>
