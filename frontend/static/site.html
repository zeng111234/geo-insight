<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/static/theme.css" />
<title>服务信源页</title>
<style>
  body { margin:0; background:var(--bg); color:var(--text-body); font-family:var(--font-sans); line-height:1.7; }
  .wrap { max-width:820px; margin:0 auto; padding:40px 22px 64px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:34px 38px; }
  h1 { color:var(--text-strong); font-size:26px; font-weight:600; margin:0 0 6px; }
  .tag { color:var(--accent-ink); background:var(--accent-weak); border-radius:999px; padding:2px 12px; font-size:12px; display:inline-block; margin-bottom:20px; }
  h2 { color:var(--text-strong); font-size:16px; font-weight:600; margin:26px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  p { margin:8px 0; }
  .kv { display:flex; gap:14px; margin:7px 0; }
  .kv .k { color:var(--muted); width:82px; flex:none; }
  .kv .v { color:var(--text-body); }
  .todo { color:var(--amber-ink); background:var(--amber-tint); border-radius:6px; padding:0 8px; font-size:13px; }
  .chip { display:inline-block; background:var(--panel-2); border:1px solid var(--border); border-radius:999px; padding:3px 12px; margin:4px 6px 0 0; font-size:13px; color:var(--text-body); }
  .foot { color:var(--muted); font-size:12px; margin-top:30px; padding-top:16px; border-top:1px solid var(--border); }
  a { color:var(--accent-ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <p>加载中…</p>
  </div>
</div>
<script>
(function () {
  var id = location.pathname.split("/").filter(Boolean).pop();
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); };
  function val(v, missing) {
    if (v === "" || v == null || (Array.isArray(v) && !v.length)) {
      return '<span class="todo">待补充</span>';
    }
    return esc(v);
  }
  function kv(k, v, missing) {
    return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v">' + val(v, missing) + '</span></div>';
  }
  fetch("/site/" + encodeURIComponent(id) + "/data").then(function (r) {
    if (!r.ok) throw new Error("NOT_FOUND");
    return r.json();
  }).then(function (d) {
    var miss = {}; (d.missing || []).forEach(function (k) { miss[k] = true; });
    var h = "";
    h += '<span class="tag">服务信源页 · 信息公开登记</span>';
    h += '<h1>' + val(d.brand, miss.brand) + '</h1>';
    if (d.industry || d.region) h += '<p style="color:var(--muted);margin-top:-2px">' + esc([d.industry, d.region].filter(Boolean).join(" · ")) + '</p>';
    h += '<h2>服务简介</h2>';
    h += '<p>' + val(d.intro, miss.intro) + '</p>';
    h += '<h2>联系方式</h2>';
    h += kv("电话", d.phone, miss.phone);
    h += kv("官网", d.website, miss.website);
    h += '<h2>服务信息</h2>';
    h += kv("服务套餐", d.package, miss.package);
    h += kv("服务价格", d.price, miss.price);
    h += kv("开始时间", d.start_date, miss.start_date);
    h += kv("负责人", d.owner, miss.owner);
    if (d.expertise) h += kv("专业特长", d.expertise, miss.expertise);
    if (d.honors) h += kv("荣誉资质", d.honors, miss.honors);
    if ((d.cases || []).length) {
      h += '<h2>成功案例</h2>';
      h += d.cases.map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join("");
    }
    if ((d.accounts || []).length) {
      h += '<h2>自有媒体</h2>';
      h += d.accounts.map(function (a) { return '<span class="chip">' + esc([a.platform, a.name].filter(Boolean).join(" · ")) + '</span>'; }).join("");
    }
    if (d.geo_words) {
      h += '<h2>服务方向</h2>';
      h += d.geo_words.split(/[,，、]/).map(function (w) { return w.trim(); }).filter(Boolean)
             .map(function (w) { return '<span class="chip">' + esc(w) + '</span>'; }).join("");
    }
    h += '<div class="foot">' + esc(d.data_note || "本页信息由服务方登记。") + '</div>';
    document.getElementById("card").innerHTML = h;
  }).catch(function () {
    document.getElementById("card").innerHTML =
      '<h1>页面不可用</h1><p>找不到这个信源页，或链接已失效。</p>';
  });
})();
</script>
</body>
</html>
