<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/static/theme.css" />
<link rel="stylesheet" href="/static/app.css" />
<script src="/static/app.js"></script>
<title>GEO Insight · 问题监控</title>
<style>
  /* 让工作台撑满可视高度：内容少时面板也要到底，否则下方会露出大片页面底色 */
  .content { display: flex; flex-direction: column; }
  /* E1b：引用栏是工作台第三栏，不进 #tabBody——切 tab 时选中态与滚动位置都不丢 */
  .mon-grid { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 12px;
    align-items: stretch; flex: 1 1 auto; min-height: 0; }
  .mon-grid.with-cite { grid-template-columns: 252px minmax(0, 1fr) 340px; }
  .mon-grid > .panel { display: flex; flex-direction: column; min-width: 0; }
  .mon-cite { display: none; }
  .mon-grid.with-cite > .mon-cite { display: flex; }
  .mon-cite .cite-head { display: flex; gap: 8px; align-items: center; padding: 11px 12px;
    border-bottom: 1px solid var(--border); font-size: var(--fs-meta); }
  .mon-cite .cite-head select { margin-left: auto; font-size: var(--fs-caption); padding: 3px 6px; }
  .mon-cite .cite-body { flex: 1; min-height: 0; overflow-y: auto; }
  .mon-cite .cite-body .hd { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: var(--fs-label); color: var(--muted); }
  @media (max-width: 1280px) {
    .mon-grid.with-cite { grid-template-columns: 220px minmax(0, 1fr) 320px; }
  }
  @media (max-width: 1100px) {
    .mon-grid, .mon-grid.with-cite { grid-template-columns: 1fr; }
    .mon-grid.with-cite > .mon-cite { display: none; }
  }

  .mon-list { overflow: hidden; }
  /* 左栏标题里多了一个「新建」按钮：badge 仍然靠右，按钮接在它后面 */
  .mon-list > h2 .badge { margin-left: auto; }
  .mon-list > h2 button.small { flex: none; }
  .mon-list .search { padding: 0 10px 10px; }
  .mon-list .search input { width: 100%; }
  #trackerList { flex: 1; overflow-y: auto; min-height: 0; }
  .titem { padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .titem:last-child { border-bottom: none; }
  .titem:hover { background: var(--subtle); }
  .titem.on { background: var(--accent-weak); border-left: 3px solid var(--accent); padding-left: 9px; }
  .titem .n { font-size: 12.5px; color: var(--text); margin-bottom: 3px; }
  .titem .m { font-size: var(--fs-caption); color: var(--muted); display: flex; gap: 6px; align-items: center; }

  .mon-head { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .mon-head .line1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mon-head h2 { margin: 0; font-size: var(--fs-title); }
  .mon-head .meta { font-size: var(--fs-caption); color: var(--muted); margin-top: 5px; display: flex; gap: 10px; flex-wrap: wrap; }
  .mon-head .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  /* 危险操作要和常规操作拉开距离：实心底 + 更重边框，不再和「刷新」一个视觉重量。 */
  .mon-head .acts .danger { background: var(--red-tint); border-color: var(--red-ink); color: var(--red-ink); }
  .mon-head .acts .danger:hover { background: var(--red-ink); color: #fff; }
  /* 窄屏下按钮组独占一行右对齐，不跟标题/状态挤在一起换行。 */
  @media (max-width: 1180px) {
    .mon-head .line1 { gap: 6px 10px; }
    .mon-head .acts { flex-basis: 100%; margin-left: 0; justify-content: flex-end; }
  }

  /* 第三栏占掉宽度后 10 个 tab 装不下一行：换行比横向滚动条好用 */
  .mon-filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 9px 12px; border-bottom: 1px solid var(--border); background: var(--subtle); }
  .mon-filters label { display: inline-flex; align-items: center; gap: 5px;
    font-size: var(--fs-caption); color: var(--muted); }
  .mon-filters select { max-width: 190px; font-size: var(--fs-label); }
  .mon-filters .dates { font-size: var(--fs-label); color: var(--text); }
  .mon-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px;
    padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .mon-tabs button { display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid transparent; background: transparent; border-radius: 999px;
    padding: 5px 11px; font-size: var(--fs-meta); color: var(--muted); white-space: nowrap; cursor: pointer; }
  .mon-tabs button:hover { background: var(--subtle); color: var(--text); }
  .mon-tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* 数字与文字之间留明确空隙并给浅边框，避免「指标看板1062提及」糊成一串。
     用 inline-flex + gap 而不是 margin：换行时整颗 tab 不拆、行高一致。 */
  .mon-tabs button .n { display: inline-block; padding: 1px 7px; min-width: 24px;
    border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text-body); font-size: var(--fs-caption); font-weight: 500;
    font-variant-numeric: tabular-nums; text-align: center; }
  .mon-tabs button.on .n { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.3); color: #fff; }
  .mon-body { flex: 1; min-height: 0; overflow-y: auto; }

  /* 对话框：app.css 里没有，settings.html 用的是它自己的内联表，这里按同一套尺寸重写一份 */
  dialog { border: 1px solid var(--border); border-radius: 12px; padding: 0;
    box-shadow: 0 20px 60px rgba(31,36,48,.18); width: min(520px, 94vw); }
  dialog::backdrop { background: rgba(31,36,48,.32); }
  dialog h2 { margin: 0; font-size: 14px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
  dialog .dialog-body { padding: 14px 16px; }
  dialog .dialog-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px;
    border-top: 1px solid var(--border); background: var(--subtle); }
  dialog code { background: var(--subtle); padding: 1px 5px; border-radius: 4px; font-size: var(--fs-label); }
  dialog .notice { margin-top: 12px; }

  /* E1e 新建抽屉：贴右侧从上到下，不像模态框那样盖住整页。
     字段与 /settings 的新建表单一致，只是容器从居中对话框换成侧滑。 */
  dialog#newDrawer { margin: 0 0 0 auto; width: min(420px, 96vw); height: 100%;
    max-height: 100%; border-radius: 0; border: none; border-left: 1px solid var(--border);
    box-shadow: -12px 0 40px rgba(31,36,48,.16); }
  dialog#newDrawer::backdrop { background: rgba(31,36,48,.22); }
  dialog#newDrawer .dialog-body { overflow-y: auto; flex: 1; }
  dialog#newDrawer form { display: flex; flex-direction: column; height: 100%; }
  dialog#newDrawer .field { display: block; margin-bottom: 12px; font-size: var(--fs-label); }
  dialog#newDrawer .field span { display: block; color: var(--muted); margin-bottom: 5px; }
  dialog#newDrawer .field input, dialog#newDrawer .field textarea { width: 100%; }
  dialog#newDrawer .field textarea { resize: vertical; min-height: 64px; }
  dialog#newDrawer .row { display: flex; gap: 8px; }
  dialog#newDrawer .row .field { flex: 1; min-width: 0; }
  dialog#newDrawer .nt-channels { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; max-height: 132px; overflow-y: auto; }
  dialog#newDrawer .nt-channels label { display: flex; align-items: center; gap: 5px; font-size: var(--fs-label); }
  dialog#newDrawer .nt-channels label.off { color: var(--muted); }
  dialog#newDrawer .nt-channels input { width: auto; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 10px; padding: 14px; }
  .kpi { border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; background: var(--panel); }
  .kpi .k { font-size: var(--fs-caption); color: var(--muted); margin-bottom: 7px; }
  .kpi .v { font-size: 25px; line-height: 1.1; font-weight: 600; color: var(--text-strong); }
  .kpi .v.small { font-size: var(--fs-title); }
  .kpi .s { font-size: var(--fs-caption); color: var(--muted); margin-top: 6px; }
  .kpi .rows { font-size: var(--fs-label); color: var(--text-body); display: grid; gap: 3px; }
  .kpi .rows i { font-style: normal; color: var(--muted); display: inline-block; width: 42px; }
  .kpi .rows b { font-weight: 500; }
  .kpi.lit { background: var(--red-tint); border-color: var(--red-line); }

  .ans-toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .ans-toolbar select { max-width: 420px; }
  .answer { border-bottom: 1px solid var(--border); padding: 12px 14px; }
  .answer:last-child { border-bottom: none; }
  .answer .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 7px; }
  .answer .text { font-size: 12.5px; line-height: 1.7; color: var(--text-body); white-space: pre-wrap; }
  .answer .cite { font-size: var(--fs-caption); color: var(--muted); margin-top: 7px; }
  .todo { padding: 22px 16px; }

  /* 问答明细：引用已提到工作台第三栏，这里只留回答列表 */
  .ans-split { display: grid; grid-template-columns: minmax(0, 1fr); flex: 1 1 auto; min-height: 0; }
  .ans-main { overflow-y: auto; min-height: 0; }
  .cite-item { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: var(--fs-label); }
  .cite-item .top { display: flex; gap: 5px; align-items: baseline; margin-bottom: 3px; }
  .cite-item .idx { color: var(--muted); font-variant-numeric: tabular-nums; }
  .cite-item a { color: var(--accent-ink); text-decoration: none; word-break: break-all; }
  .cite-item a:hover { text-decoration: underline; }
  .cite-item .sub { color: var(--muted); font-size: var(--fs-caption); }
  .answer.sel { background: var(--accent-weak); }
  /* E1c：视图切换 + 表格视图 + 行内复制 */
  .ans-view { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .ans-view button { border: 0; background: transparent; padding: 4px 12px; font-size: var(--fs-label);
    color: var(--muted); cursor: pointer; }
  .ans-view button + button { border-left: 1px solid var(--border); }
  .ans-view button.on { background: var(--accent); color: #fff; }
  button.copy-answer { border: 1px solid var(--border); background: var(--panel); color: var(--accent-ink);
    border-radius: 6px; padding: 3px 9px; font-size: var(--fs-caption); cursor: pointer; }
  button.copy-answer:hover { background: var(--accent-weak); }
  /* P2：截图 / 纠正按钮与纠正回显标记 */
  button.answer-shot, button.answer-correct { border: 1px solid var(--border); background: var(--panel);
    color: var(--accent-ink); border-radius: 6px; padding: 3px 9px; font-size: var(--fs-caption);
    cursor: pointer; }
  button.answer-shot:hover, button.answer-correct:hover { background: var(--accent-weak); }
  .tag.corrected { color: #8a5a00; background: #fff4d6; border-color: #e5c365; }
  /* 数据来源标识：真实采集要醒目，演示/离线数据要一眼看出"不能当真"。 */
  .tag.source-real { color: #0a6b32; background: #e6f6ec; border-color: #68bb8a; font-weight: 600; }
  .tag.source-demo { color: #6b6b6b; background: #f2f2f2; border-color: #d0d0d0; }
  .tag.source-offline, .tag.source-import, .tag.source-unknown { color: #7a5b00; background: #fff7e0; border-color: #e2c65e; }
  .source-banner { margin: 8px 0 2px; padding: 7px 11px; border-radius: 8px; font-size: var(--fs-meta); line-height: 1.6; border: 1px solid; }
  .source-banner.mixed { color: #8a4f0a; background: #fdf4e3; border-color: #f2dcb3; }
  .source-banner.demo-only { color: #6b6b6b; background: #f6f6f6; border-color: #dcdcdc; }
  .source-banner.real-only { color: #0a6b32; background: #e6f6ec; border-color: #68bb8a; }
  .source-banner b { font-weight: 600; }
  /* 小样本提示：诚实说明数据还在积累，不把"样本不足"渲染成故障告警。 */
  .sample-notice { margin: 0 14px 12px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid #f2dcb3; background: #fdf8ec; color: #7a5a12;
    font-size: var(--fs-meta); line-height: 1.6; }
  .sample-notice b { color: #8a4f0a; }
  .kpi.pending { background: var(--panel); border-color: var(--border); }
  .kpi.pending .v { color: var(--muted); font-size: var(--fs-title); font-weight: 500; }
  .correction-form { position: fixed; z-index: 60; right: 24px; bottom: 24px; width: 340px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.18); padding: 16px; }
  .correction-form h4 { margin: 0 0 10px; font-size: 15px; }
  .correction-form label { display: block; margin: 8px 0 4px; font-size: var(--fs-caption); }
  .correction-form select, .correction-form input, .correction-form textarea {
    width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--bg); color: var(--ink); font-size: var(--fs-meta); }
  .correction-form textarea { min-height: 64px; resize: vertical; }
  .correction-form .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .correction-form button { padding: 6px 14px; border-radius: 6px; cursor: pointer; }
  .ans-table { font-size: var(--fs-meta); }
  .ans-table td { vertical-align: top; }
  .ans-table tr.sel { background: var(--accent-weak); }
  .ans-table th, .ans-table td { padding: 9px 10px; }
  .ans-table td:nth-child(4) { max-width: 340px; word-break: break-word; }
  .ans-table td:last-child { white-space: nowrap; }
  .ans-table td:last-child a { margin-left: 8px; }

  /* 指标明细 / 趋势 / 信源 共用 */
  .tab-pad { padding: 12px 14px; }
  .metric-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .metric-bar button { font-size: var(--fs-label); padding: 4px 10px; border-radius: 999px; }
  .metric-bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .rule { font-size: var(--fs-caption); color: var(--muted); margin: 9px 0 10px; line-height: 1.6; }
  .bars { display: grid; gap: 6px; }
  .bar-row { display: grid; grid-template-columns: 104px minmax(0, 1fr) 62px; gap: 9px; align-items: center; font-size: var(--fs-label); }
  .bar-row .track { height: 7px; background: var(--subtle); border-radius: 999px; overflow: hidden; }
  .bar-row .fill { display: block; height: 100%; background: var(--accent); }
  .bar-row .val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .spark { width: 100%; height: 168px; display: block; }
  .dash-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
    gap: 12px; padding: 0 14px 14px; align-items: start; }
  .dash-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .dash-head { display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 12px 8px; font-size: 12.5px; font-weight: 600; color: var(--text-strong); }
  .dash-head span { font-size: var(--fs-caption); font-weight: 400; color: var(--muted); }
  .dash-card .table-wrap { border: 0; border-top: 1px solid var(--border); border-radius: 0; }
  .dash-card .spark { height: 232px; padding: 2px 10px 0; }
  .dash-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    padding: 4px 12px 12px; font-size: var(--fs-caption); color: var(--muted); }
  .dash-facts b { display: block; font-size: 16px; font-weight: 600; color: var(--text-strong); margin: 2px 0 1px; }
  .dash-cites { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 2px; }
  @media (max-width: 1180px) { .dash-grid { grid-template-columns: 1fr; } }
  .tag.kw { color: var(--accent-ink); border-color: var(--accent-weak); background: var(--accent-weak); margin-left: 2px; }
  .sent-table .sentiment { margin-top: 0; }
  .note-line { margin-top: 12px; font-size: var(--fs-caption); color: var(--muted); }
  .note-line code { font-size: var(--fs-caption); background: var(--panel-2); padding: 1px 4px; border-radius: 4px; }
  .matrix th, .matrix td { padding: 5px 7px; font-size: var(--fs-caption); white-space: nowrap; min-width: 46px; }
  .matrix td.n { text-align: center; font-variant-numeric: tabular-nums; }
  .matrix td.diag { background: var(--subtle); color: var(--muted); text-align: center; }
  .cmp-bar { display: block; height: 7px; background: var(--subtle); border-radius: 999px; overflow: hidden; }
  .cmp-bar > span { display: block; height: 100%; background: var(--accent); }
</style>
</head>
<body>
<div class="shell">
  <!-- 第一个 aside 必须是侧栏占位：服务端会把整段替换成统一导航（见 api/nav.py 的 _SIDE_RE） -->
  <aside class="side"></aside>
  <main>
    <header class="top">
      <h1>问题监控</h1>
      <span class="sub">选一个监控对象，看它的指标、问答与证据</span>
      <span class="spacer"></span>
      <!-- 隐藏的原生 select：app.js 的 tracker()/dates() 约定读这几个 id，其它页面同理 -->
      <select id="tracker" hidden aria-hidden="true"></select>
      <input id="from" type="date" value="2026-11-01" aria-label="开始日期" />
      <input id="to" type="date" value="2026-11-30" aria-label="结束日期" />
      <button id="load" class="primary">查询</button>
    </header>
    <div class="content">
      <div class="mon-grid">
        <div class="panel mon-list">
          <!-- 菜单里没有「监控配置」（参考系统也没有），新建入口放在左栏顶部；
               E1e 会把它改成右侧抽屉，现在先跳配置页，不留死路 -->
          <h2>监控列表 <span class="badge" id="listMeta">—</span>
            <button type="button" class="small" id="newTracker">＋ 新建</button></h2>
          <div class="search"><input id="listSearch" type="search" placeholder="搜索名称或行业" /></div>
          <div id="trackerList"><div class="empty">加载中…</div></div>
        </div>

        <section class="panel mon-main">
          <div class="mon-head">
            <div class="line1">
              <h2 id="objName">—</h2>
              <span class="tag" id="objStatus">—</span>
              <!-- 按钮组按参考系统排序：7 个动作齐全，表格浏览直达问答明细表格视图 -->
              <div class="acts">
                <button id="reportBtn" type="button">下载报告</button>
                <button id="tableBrowseBtn" type="button">表格浏览</button>
                <button id="exportBtn" type="button">导出</button>
                <button id="refreshBtn" type="button">刷新</button>
                <button id="pauseBtn" type="button">暂停</button>
                <button id="deleteBtn" type="button" class="danger">删除</button>
                <a class="btn" href="/settings">编辑</a>
              </div>
            </div>
            <div class="meta" id="objMeta"></div>
            <!-- 数据来源横幅：一眼看清当前对象的数据是真实采集还是演示数据。 -->
            <div id="sourceBanner" class="source-banner" style="display:none" aria-live="polite"></div>
          </div>
          <div class="mon-filters" id="filterBar">
            <label>品牌 <select id="brandFilter" aria-label="品牌"><option value="">加载中…</option></select></label>
            <label>问题 <select id="questionFilter" aria-label="问题"><option value="">全部问题</option></select></label>
            <label>模型 <select id="modelFilter" aria-label="模型"><option value="">全部模型</option></select></label>
            <label>端 <select id="clientFilter" aria-label="端"><option value="">全部端</option><option value="web">网页</option><option value="mobile">手机</option></select></label>
            <span class="muted" id="modelChannelHint" style="font-size:var(--fs-caption)"></span>
            <label>日期 <span class="dates" id="filterDates"></span></label>
            <button type="button" class="small" id="clearFilters">清除筛选</button>
          </div>
          <nav class="mon-tabs" id="tabs" role="tablist"></nav>
          <div class="mon-body" id="tabBody"><div class="empty">加载中…</div></div>
        </section>

        <section class="panel mon-cite" id="citeRail">
          <div class="cite-head">
            <span>引用信源</span>
            <!-- 文章监控名单尚未接入（后端 monitoring_available=false）；点前就标出，
                 不让客户选了才发现是空功能。保留可选以维持 citeView=monitored 深链与诚实提示。 -->
            <select id="citeView" aria-label="引用视图">
              <option value="all">全部</option>
              <option value="monitored">已监控（未接入）</option>
            </select>
          </div>
          <div class="cite-body" id="citeBody"><div class="empty">选一条回答看它的引用</div></div>
        </section>
      </div>
    </div>
  </main>
</div>

<!-- 删除确认：要求手打对象名，不是点一下「确定」。
     一次删除会带走该对象的问题、答案、提及、引用与报告，误点的代价太大。 -->
<!-- E1e 新建监控右侧抽屉：字段与校验和 /settings 的 newForm 完全一致。
     就近创建，不跳页——演示时跳出当前上下文最容易断节奏。 -->
<dialog id="newDrawer">
  <form id="newTrackerForm">
    <h2>新建监控对象 <span class="badge">建后再导入问题</span></h2>
    <div class="dialog-body">
      <label class="field"><span>官网地址（可选）</span>
        <input id="ntWebsite" type="text" placeholder="https://（选填，答案中出现的官网）" /></label>
      <label class="field"><span>监控名称 *</span>
        <input id="ntName" type="text" required placeholder="例：大连示例医美" /></label>
      <label class="field"><span>品牌名称 *</span>
        <input id="ntBrand" type="text" required placeholder="答案中出现的正式名称" /></label>
      <label class="field"><span>核心词（逗号分隔）</span>
        <input id="ntKeywords" type="text" placeholder="律师, 律所  —— 用逗号分隔简称或产品词" /></label>
      <div class="row">
        <label class="field"><span>行业</span><input id="ntIndustry" type="text" /></label>
        <label class="field"><span>地区</span><input id="ntRegion" type="text" /></label>
      </div>
      <label class="field"><span>别名（逗号分隔）</span>
        <input id="ntAliases" type="text" placeholder="简称, 英文名" /></label>
      <label class="field"><span>竞品（逗号分隔）</span>
        <input id="ntCompetitors" type="text" /></label>
      <label class="field"><span>监控问题（每行一个，* 开头设为核心问题）</span>
        <textarea id="ntQuestions" rows="3" placeholder="武汉火锅哪家好吃？&#10;*哪家律所比较专业？"></textarea></label>
      <div class="field"><span>采集渠道（建后按已接入渠道安排）</span>
        <div id="ntChannels" class="nt-channels">加载中…</div></div>
      <div class="notice warn">保存后按已接入渠道安排采样：核心 3 次 / 长尾 1 次。未接入渠道不会画空图、不填假数据。</div>
      <div id="ntError"></div>
    </div>
    <div class="dialog-foot">
      <button type="button" id="ntCancel">取消</button>
      <button type="submit" class="primary">创建并继续</button>
    </div>
  </form>
</dialog>

<dialog id="delDialog">
  <form method="dialog">
    <h2>删除监控对象</h2>
    <div class="dialog-body">
      <p id="delSummary" style="margin:0 0 12px;font-size:12.5px;line-height:1.7"></p>
      <label class="field"><span>输入对象名称以确认：<code id="delName"></code></span>
        <input id="delInput" type="text" autocomplete="off" placeholder="逐字输入上面的名称" /></label>
      <div class="notice warn">删除会连带清空该对象的问题、答案、提及、引用与报告，不可恢复。审计日志会留下这次删除的完整快照。</div>
    </div>
    <div class="dialog-foot">
      <button value="cancel">取消</button>
      <button value="ok" id="delOk" class="danger" disabled>永久删除</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  var G = window.GEO, $ = G.$, esc = G.esc;

  // 十个 tab 与参考系统同名同序。加 tab 时同步改这里和 RENDER。
  var TABS = [
    ["dashboard", "指标看板"],
    ["answers", "问答明细"],
    ["metrics", "指标明细"],
    ["trend", "趋势分析"],
    ["competitors", "竞品排名"],
    ["sources", "信源分析"],
    ["sentiment", "情感倾向"],
    ["competitorStats", "竞品统计"],
    ["media", "视频/图文引用"],
    ["health", "采集健康"]
  ];

  var state = {
    trackers: [],
    trackerId: "",
    tab: "dashboard",
    questions: [],
    questionId: "",
    filterQuestion: "",
    filterModel: "",
    filterClient: "",
    tabCounts: {},
    answers: [],
    answerTotal: 0,
    answerPages: 1,
    selectedAnswer: "",
    citeView: "all",
    answerView: "reading",
    monitoringAvailable: false,
    metric: "mention_rate",
    mediaType: "video",
    granularity: "day"
  };

  var STATUS_TEXT = { active: "监控中", draft: "草稿", paused: "已暂停", archived: "已归档" };
  var SENTI_TEXT = { pos: "正面", neu: "中性", neg: "负面" };
  var fmtPct = function (v) { return v === null || v === undefined ? "—" : (v * 100).toFixed(1) + "%"; };
  var fmtNum = function (v, d) { return v === null || v === undefined ? "—" : Number(v).toFixed(d === undefined ? 2 : d); };
  // 小样本时指标卡怎么显示。口径不变（后端仍返回 insufficient_samples），
  // 只把"样本不足"这种像报错的措辞换成"待积累"+原因，避免看起来像系统坏了。
  var metric = function (m, kind) {
    if (!m) return { text: "—", sub: "" };
    if (m.status === "insufficient_samples") {
      var why = (m.sample_base || 0) === 0 ? "暂无带位次的样本" : "分母 " + m.sample_base + " 条，仍在积累";
      return { text: "待积累", sub: why, warn: true };
    }
    return {
      text: kind === "num" ? fmtNum(m.value) : fmtPct(m.value),
      sub: "分母 " + (m.sample_base || 0) + " 条"
    };
  };

  // ---- 路由：tab 与对象都进 URL，刷新和前进后退都能回到原处 ----
  function validTab(id) { return TABS.some(function (t) { return t[0] === id; }); }
  function readQuery() {
    var q = new URLSearchParams(location.search);
    var tab = q.get("tab");
    return {
      tab: validTab(tab) ? tab : "dashboard",
      tracker: q.get("tracker") || "",
      citeView: q.get("citeView") === "monitored" ? "monitored" : "all",
      answerView: q.get("view") === "table" ? "table" : "reading",
      filterQuestion: q.get("question") || "",
      filterModel: q.get("model") || "",
      filterClient: q.get("client") || "",
      granularity: q.get("g") === "week" ? "week" : "day"
    };
  }
  function datesF() { return G.dates() + filterQuery(); }

  function filterQuery() {
    return (state.filterQuestion ? "&questionId=" + encodeURIComponent(state.filterQuestion) : "") +
      (state.filterModel ? "&model=" + encodeURIComponent(state.filterModel) : "") +
      (state.filterClient ? "&client=" + encodeURIComponent(state.filterClient) : "");
  }

  function syncFilterControls() {
    if (!$("filterDates")) return;
    $("filterDates").textContent = $("from").value + " ~ " + $("to").value;
    // 品牌是真实筛选维度：一个监控对象对应一个品牌，选中即切对象。
    // 之前写死「本品牌」是假筛选——下拉里根本选不出第二个值。
    var bsel = $("brandFilter");
    if (bsel) {
      bsel.innerHTML = (state.trackers || []).map(function (t) {
        return '<option value="' + esc(t.id) + '"' +
          (t.id === state.trackerId ? " selected" : "") + ">" +
          esc(t.brand_name || t.name) + "</option>";
      }).join("") || '<option value="">无监控对象</option>';
      bsel.value = state.trackerId;
    }
    var qs = state.questions || [];
    var qsel = $("questionFilter");
    if (qsel) {
      qsel.innerHTML = '<option value="">全部问题</option>' + qs.map(function (q) {
        return '<option value="' + esc(q.id) + '"' +
          (q.id === state.filterQuestion ? " selected" : "") + ">" +
          esc(q.text || q.id) + "</option>";
      }).join("");
      qsel.value = state.filterQuestion;
    }
    var msel = $("modelFilter");
    if (msel && !msel.dataset.ready) {
      // 模型与端是两个独立维度：模型从 8 个里选，端从独立下拉选。
      // 下拉不再写「·网页」——端由 clientFilter 决定，避免两处口径打架。
      msel.innerHTML = '<option value="">全部模型</option>' +
        ["doubao", "deepseek", "kimi", "qwen", "yuanbao", "wenxin", "quark", "bing"].map(function (m) {
          return '<option value="' + m + '">' + m + "</option>";
        }).join("");
      msel.dataset.ready = "1";
    }
    if (msel) msel.value = state.filterModel;
    var csel = $("clientFilter");
    if (csel) csel.value = state.filterClient;
    var hint = $("modelChannelHint");
    if (hint) hint.textContent = state.filterClient === "mobile"
      ? "手机端尚未接入采集，筛选结果可能为 0"
      : "模型按 8 个渠道选；端可单独筛选";
  }

  async function applyFilters() {
    syncUrl(true);
    syncFilterControls();
    try { await loadTabCounts(); } catch (e) { G.fail(e, ["tabBody"]); }
    G.pagerReset("mon-answers");
    renderTab();
  }

  async function loadTabCounts() {
    if (!state.trackerId) return;
    var d = await G.get("/trackers/" + state.trackerId + "/metrics/tab-counts?" +
      datesF());
    var byTab = {};
    (d.items || []).forEach(function (x) { byTab[x.tab] = x; });
    state.tabCounts = byTab;
    renderTabs();
  }

  function syncUrl(push) {
    var url = new URL(location.href);
    url.searchParams.set("tab", state.tab);
    if (state.trackerId) url.searchParams.set("tracker", state.trackerId);
    if (state.filterQuestion) url.searchParams.set("question", state.filterQuestion);
    else url.searchParams.delete("question");
    if (state.filterModel) url.searchParams.set("model", state.filterModel);
    else url.searchParams.delete("model");
    if (state.filterClient) url.searchParams.set("client", state.filterClient);
    else url.searchParams.delete("client");
    if (state.tab === "trend" && state.granularity === "week") url.searchParams.set("g", "week");
    else url.searchParams.delete("g");
    if (state.tab === "answers" && state.answerView === "table") url.searchParams.set("view", "table");
    else url.searchParams.delete("view");
    if (push) history.pushState({ tab: state.tab }, "", url);
    else history.replaceState({ tab: state.tab }, "", url);
  }

  // ---- 左栏 ----
  function renderTrackerList() {
    var kw = ($("listSearch").value || "").trim().toLowerCase();
    var items = state.trackers.filter(function (t) {
      if (!kw) return true;
      return (t.name + " " + (t.industry || "") + " " + (t.region || "")).toLowerCase().indexOf(kw) >= 0;
    });
    $("listMeta").textContent = items.length + " / " + state.trackers.length;
    if (!state.trackers.length) {
      $("trackerList").innerHTML = G.empty("还没有监控对象，点上方「＋ 新建」开始");
      return;
    }
    if (!items.length) { $("trackerList").innerHTML = G.empty("没有匹配的监控对象"); return; }
    $("trackerList").innerHTML = items.map(function (t) {
      var qs = t.question_summary || {};
      return '<div class="titem' + (t.id === state.trackerId ? " on" : "") + '" data-tracker="' + esc(t.id) + '">' +
        '<div class="n">' + esc(t.name) + "</div>" +
        '<div class="m"><span class="tag ' + (t.status === "active" ? "ok" : "") + '">' +
          esc(STATUS_TEXT[t.status] || t.status) + "</span>" +
          "<span>" + esc(t.industry || "未填行业") + "</span>" +
          "<span>" + G.num(qs.total) + " 个问题</span></div></div>";
    }).join("");
  }

  function renderHead() {
    var t = state.trackers.filter(function (x) { return x.id === state.trackerId; })[0];
    if (!t) { $("objName").textContent = "—"; $("objMeta").textContent = ""; return; }
    var qs = t.question_summary || {};
    $("objName").textContent = t.brand_name || t.name;
    var st = $("objStatus");
    st.textContent = STATUS_TEXT[t.status] || t.status;
    st.className = "tag " + (t.status === "active" ? "ok" : "");
    // 核心词单独做成 chip：它是"判断跑题"的依据，和行业/地区这类描述性字段不是一回事
    var kwChips = (t.keywords || []).map(function (k) {
      return '<span class="tag kw">' + esc(k) + "</span>";
    }).join("");
    $("objMeta").innerHTML = [
      t.name,
      t.industry,
      t.region,
      "创建于 " + String(t.created_at || "").slice(0, 10),
      qs.total + " 个问题（核心 " + (qs.core || 0) + " / 长尾 " + (qs.long_tail || 0) + "）"
    ].filter(Boolean).map(esc).map(function (v) { return "<span>" + v + "</span>"; }).join("") + kwChips;

    // 按钮跟着状态走：已暂停时显示「恢复」，已归档时既不能暂停也不能删（归档是终态）
    $("pauseBtn").textContent = t.status === "paused" ? "恢复" : "暂停";
    $("pauseBtn").disabled = t.status === "archived";
    $("deleteBtn").disabled = t.status === "archived";
    renderSourceBanner();
  }

  // 数据来源横幅：把"这个对象的数据能不能当真"摆在明面上，不让人对着混在一起的数字猜。
  // 只做展示，不改任何数据；拿不准的来源统一按接口给的标签显示，前端不自己猜。
  async function renderSourceBanner() {
    var el = $("sourceBanner");
    if (!state.trackerId) { el.style.display = "none"; return; }
    try {
      var d = await G.get("/trackers/" + state.trackerId + "/data-provenance");
      if (d.total === 0) {
        el.style.display = "none";
        return;
      }
      var parts = Object.keys(d.by_kind || {}).map(function (k) {
        return esc(d.labels[k] || k) + " " + d.by_kind[k] + " 条";
      });
      var cls = d.has_mixed ? "mixed" : (d.real_count > 0 ? "real-only" : "demo-only");
      var lead = d.has_mixed
        ? "混合数据：仅 <b>" + d.real_count + " 条</b>是真实采集，其余为演示/样例，看板数字不代表真实效果。"
        : (d.real_count > 0
          ? "真实数据：本对象 <b>" + d.real_count + " 条</b>均为真实平台采集。"
          : "演示数据：本对象 <b>" + d.total + " 条</b>均为种子/演示，不是真实采集，勿据此判断效果。");
      el.className = "source-banner " + cls;
      el.innerHTML = lead + '<div class="muted" style="font-size:var(--fs-caption)">' + parts.join(" · ") + "</div>";
      el.style.display = "";
    } catch (e) {
      // 横幅是提示，拿不到就藏起来，不能因为提示接口失败让整个页面崩掉。
      el.style.display = "none";
    }
  }

  function currentTracker() {
    return state.trackers.filter(function (x) { return x.id === state.trackerId; })[0] || null;
  }

  function renderTabs() {
    $("tabs").innerHTML = TABS.map(function (t) {
      var c = state.tabCounts[t[0]];
      var num = c ? '<span class="n">' + c.count + (c.unit || "") + "</span>" : "";
      return '<button type="button" role="tab" data-tab="' + t[0] + '"' +
        (t[0] === state.tab ? ' class="on" aria-selected="true"' : ' aria-selected="false"') +
        ">" + esc(t[1]) + num + "</button>";
    }).join("");
  }

  // ---- 各 tab 的渲染 ----
  async function renderDashboard() {
    // 三个请求互不依赖，并发发出去；串行等会让这块多花两个 RTT。
    var base = "/trackers/" + state.trackerId;
    var res = await Promise.all([
      G.get(base + "/metrics/overview?" + datesF()),
      G.get(base + "/metrics/by-question?" + datesF()),
      G.get(base + "/metrics/trend?" + datesF()),
      G.get(base + "/citations/summary?" + datesF())
    ]);
    var d = res[0], perf = res[1], trend = res[2], cites = res[3];
    var c = d.cards || {};
    var mention = metric(c.mention_rate);
    var rank = metric(c.avg_rank, "num");
    var senti = c.sentiment || {};
    var sentiWarn = senti.status === "insufficient_samples";

    var kpi = function (label, text, sub, lit, small) {
      return '<div class="kpi' + (lit ? " lit" : "") + '"><div class="k">' + esc(label) + "</div>" +
        '<div class="v' + (small ? " small" : "") + '">' + esc(text) + "</div>" +
        (sub ? '<div class="s">' + esc(sub) + "</div>" : "") + "</div>";
    };

    // 小样本阈值：低于这个量，提及率会随一条样本剧烈跳动，排名/情感不足以判断。
    // 只影响呈现与提示，不改任何指标口径或后端计算。
    var SMALL_SAMPLE = 30;
    var small = (d.valid_total || 0) < SMALL_SAMPLE;
    var exposure = '<div class="kpi' + (small ? " pending" : " lit") + '"><div class="k">高位曝光</div><div class="rows">' +
      [["Top1", c.top1_rate], ["Top3", c.top3_rate], ["Top10", c.top10_rate]].map(function (p) {
        var m = p[1] || {};
        var text = m.status === "insufficient_samples" ? "待积累" : fmtPct(m.value);
        return "<div><i>" + p[0] + "</i><b>" + esc(text) + "</b></div>";
      }).join("") + "</div>" + (small ? '<div class="s">需答案给出排名列表</div>' : "") + "</div>";

    var sentiment = '<div class="kpi"><div class="k">情感倾向</div>' +
      (sentiWarn
        ? '<div class="v small">待积累</div>'
        : '<div class="sentiment-split">' +
          '<span class="pos">正 <b>' + fmtPct(senti.pos) + "</b></span>" +
          '<span class="neu">中 <b>' + fmtPct(senti.neu) + "</b></span>" +
          '<span class="neg">负 <b>' + fmtPct(senti.neg) + "</b></span></div>" +
          '<div class="sentiment"><span class="pos" style="width:' + ((senti.pos || 0) * 100) + '%"></span>' +
          '<span class="neu" style="width:' + ((senti.neu || 0) * 100) + '%"></span>' +
          '<span class="neg" style="width:' + ((senti.neg || 0) * 100) + '%"></span></div>') +
      '<div class="s">分母为提及样本 ' + G.num(senti.base) + " 条</div></div>";

    // 分问题表现：样本不足 / 未采集要分开标，不能都显示成 0%
    var qRows = ((perf && perf.items) || []).map(function (q) {
      var rateCell = q.status === "ok"
        ? fmtPct(q.mention_rate)
        : q.status === "no_samples"
          ? '<span class="muted">未采集</span>'
          : '<span class="muted">样本少·待积累</span>';
      var bar = q.status === "ok"
        ? '<span class="cmp-bar"><span style="width:' + (q.mention_rate * 100).toFixed(1) + '%"></span></span>'
        : "";
      return "<tr><td>" + esc(q.text) + "</td>" +
        '<td><span class="tag ' + (q.tier === "core" ? "core" : "") + '">' +
        (q.tier === "core" ? "核心" : "长尾") + "</span></td>" +
        '<td class="num">' + G.num(q.samples) + "</td>" +
        '<td class="num">' + rateCell + "</td>" +
        '<td class="num">' + fmtNum(q.avg_rank) + "</td>" +
        '<td style="width:96px">' + bar + "</td></tr>";
    }).join("");

    // 趋势：只对"有样本的日子"算最新/最高，没样本的日子单独计数
    var pts = (trend && trend.points) || [];
    var withData = pts.filter(function (p) {
      return p.mention_rate !== null && p.mention_rate !== undefined;
    });
    var latest = withData.length ? withData[withData.length - 1] : null;
    var best = withData.reduce(function (a, b) {
      return a === null || b.mention_rate > a.mention_rate ? b : a;
    }, null);
    var trendBox = pts.length
      ? trendSvg(pts) +
        '<div class="dash-facts">' +
        '<div><i>最新</i><b>' + fmtPct(latest ? latest.mention_rate : null) + "</b><span>" +
        esc(latest ? latest.date.slice(5) : "—") + "</span></div>" +
        '<div><i>最高</i><b>' + fmtPct(best ? best.mention_rate : null) + "</b><span>" +
        esc(best ? best.date.slice(5) : "—") + "</span></div>" +
        '<div><i>无样本</i><b>' + (pts.length - withData.length) + " 天</b><span>共 " +
        pts.length + " 天</span></div></div>"
      : G.empty("该周期没有按日数据");

    var citeBox = '<div class="dash-facts dash-cites">' +
      "<div><i>引用</i><b>" + G.num(cites.total_citations) + "</b><span>条</span></div>" +
      "<div><i>独立域名</i><b>" + G.num(cites.unique_domains) + "</b><span>个</span></div>" +
      "<div><i>视频占比</i><b>" + fmtPct(cites.video_share) + "</b><span>按引用数</span></div>" +
      "</div>";

    // 小样本提示：摆在明面上，说明"数字在动、别当定论"，而不是让用户对着跳动的百分比猜。
    var sampleNotice = small
      ? '<div class="sample-notice"><b>试运行 · 样本积累中</b>：当前周期仅 ' +
        G.num(d.valid_total) + " 条真实样本，提及率每变化一条就会明显跳动；" +
        "排名/情感等指标需更多样本与带位次的答案才能稳定。此阶段数据仅供参考，<b>不代表最终效果</b>。</div>"
      : "";

    $("tabBody").innerHTML = sampleNotice + '<div class="kpis">' +
      kpi("提问次数", G.num(d.valid_total), "周期内有效回答 " + G.num(d.valid_total) + " 条") +
      kpi("提及率", mention.text, mention.sub) +
      kpi("平均排名", rank.text, rank.sub) +
      exposure + sentiment +
      "</div>" +
      '<div class="dash-grid">' +
      '<div class="dash-card"><div class="dash-head">分问题表现' +
      '<span>' + G.num(perf.totals.questions) + " 个问题 · 覆盖 " +

  // 复制全文：正文只从 state.answers 取，绝不读 DOM 里那段截断的显示文本。
  // clipboard API 在 http/iframe/权限拒绝时都可能失败，所以要有 textarea 兜底。
  async function copyAnswerText(answerId) {
    var a = state.answers.filter(function (x) { return x.id === answerId; })[0];
    if (!a) { G.toast("找不到这条回答"); return; }
    var text = a.text || "";
    var done = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        done = true;
      }
    } catch (_) { /* 落到下面的兜底 */ }
    if (!done) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { done = document.execCommand("copy"); } catch (_) { done = false; }
      document.body.removeChild(ta);
    }
    G.toast(done ? "已复制全文（" + text.length + " 字）" : "复制失败，请手动选择正文");
  }

  // P2 截图：把这条回答的「可视区」画进 canvas 再导出 PNG。
  // 不用 html2canvas——项目零前端依赖，线上可能没网加载 CDN；自己画文本+标签，
  // 导出的是真实图片（可下载、可打开），不是给个按钮假装截图。
  // 逐行折行：canvas 的 fillText 不自动换行，长回答必须手动切，否则会画出画布外。
  function wrapText(ctx, text, maxWidth) {
    var lines = [];
    String(text || "").split("\n").forEach(function (para) {
      var line = "";
      for (var i = 0; i < para.length; i++) {
        var next = line + para[i];
        if (ctx.measureText(next).width > maxWidth && line) {
          lines.push(line); line = para[i];
        } else { line = next; }
      }
      lines.push(line);
    });
    return lines;
  }

  function shotAnswer(answerId) {
    var a = state.answers.filter(function (x) { return x.id === answerId; })[0];
    if (!a) { G.toast("找不到这条回答"); return; }
    var W = 760, pad = 28, y = pad;
    var canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = 200;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, canvas.height);
    ctx.fillStyle = "#1b1b1b"; ctx.font = "600 15px sans-serif";
    ctx.fillText("回答截图 · " + String(a.collected_at).slice(0, 16).replace("T", " "), pad, y + 18);
    y += 52;
    ctx.font = "12px sans-serif"; ctx.fillStyle = "#555";
    ctx.fillText("模型 " + a.model_key + "  ·  引用 " + (a.citations || []).length + " 条  ·  通道 " + a.channel, pad, y);
    y += 30;
    ctx.font = "14px sans-serif"; ctx.fillStyle = "#1b1b1b";
    var lines = wrapText(ctx, a.text || "", W - pad * 2);
    // 高度按实际行数定，重设 width 会清画布，所以先量行数再一次性定高。
    var lineH = 22;
    var need = y + lines.length * lineH + pad + 30;
    canvas.height = Math.max(200, need);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, canvas.height);
    ctx.fillStyle = "#1b1b1b"; ctx.font = "600 15px sans-serif";
    ctx.fillText("回答截图 · " + String(a.collected_at).slice(0, 16).replace("T", " "), pad, 46);
    ctx.font = "12px sans-serif"; ctx.fillStyle = "#555";
    ctx.fillText("模型 " + a.model_key + "  ·  引用 " + (a.citations || []).length + " 条  ·  通道 " + a.channel, pad, 76);
    ctx.font = "14px sans-serif"; ctx.fillStyle = "#1b1b1b";
    lines.forEach(function (line, i) { ctx.fillText(line, pad, 110 + i * lineH); });
    ctx.fillStyle = "#888"; ctx.font = "11px sans-serif";
    ctx.fillText("GEO Insight · 人工识别结果以系统内为准", pad, canvas.height - 12);

    var url = canvas.toDataURL("image/png");
    var link = document.createElement("a");
    link.href = url;
    link.download = "answer-" + answerId.slice(0, 8) + ".png";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    G.toast("已导出截图（" + lines.length + " 行正文）");
  }

  // P2 纠正弹层：独立表写入，只影响回显，不改自动识别的指标。
  function openCorrectionForm(answerId) {
    var a = state.answers.filter(function (x) { return x.id === answerId; })[0];
    if (!a) { G.toast("找不到这条回答"); return; }
    var old = document.querySelector(".correction-form");
    if (old) old.remove();
    var c = a.correction || {};
    var own = c.own_mentioned === null || c.own_mentioned === undefined ? "" : String(c.own_mentioned);
    var sentiment = c.sentiment || "";
    var box = document.createElement("div");
    box.className = "correction-form";
    box.dataset.answer = answerId;
    box.innerHTML = '<h4>人工纠正 · ' + esc(String(a.collected_at).slice(0, 16).replace("T", " ")) + "</h4>" +
      '<label>本品牌是否提及</label><select data-field="own_mentioned">' +
        '<option value="">未判定</option>' +
        '<option value="1"' + (own === "1" ? " selected" : "") + ">提及</option>" +
        '<option value="0"' + (own === "0" ? " selected" : "") + ">未提及</option></select>" +
      '<label>情感</label><select data-field="sentiment">' +
        '<option value="">未判定</option>' +
        ["pos", "neu", "neg"].map(function (v) {
          return '<option value="' + v + '"' + (sentiment === v ? " selected" : "") + ">" +
            esc(SENTI_TEXT[v] || v) + "</option>";
        }).join("") + "</select>" +
      '<label>位次（≥1）</label><input data-field="position" type="number" min="1" value="' +
        (c.position == null ? "" : c.position) + '">' +
      '<label>备注</label><textarea data-field="note" maxlength="2000">' + esc(c.note || "") + "</textarea>" +
      '<div class="row"><button type="button" data-act="cancel">取消</button>' +
      '<button type="button" data-act="save">保存纠正</button></div>';
    document.body.appendChild(box);
    // 填过的纠正要能读回来改，所以打开时异步拉一次权威值，避免列表缓存过期
    G.get("/answers/" + encodeURIComponent(answerId) + "/correction").then(function (d) {
      if (!box.isConnected) return;
      var fresh = (d && d.correction) || {};
      box.querySelector('[data-field="own_mentioned"]').value =
        fresh.own_mentioned == null ? "" : String(fresh.own_mentioned);
      box.querySelector('[data-field="sentiment"]').value = fresh.sentiment || "";
      box.querySelector('[data-field="position"]').value = fresh.position == null ? "" : fresh.position;
      box.querySelector('[data-field="note"]').value = fresh.note || "";
    }).catch(function () { /* 打不开就沿用列表里的值，不阻断人工录入 */ });
  }

  async function saveCorrection(box) {
    var id = box.dataset.answer;
    var payload = {};
    Array.prototype.forEach.call(box.querySelectorAll("[data-field]"), function (el) {
      var field = el.dataset.field;
      var raw = el.value.trim();
      if (field === "note") payload.note = raw;
      else if (field === "position") payload.position = raw === "" ? null : Number(raw);
      else if (field === "own_mentioned") payload.own_mentioned = raw === "" ? null : Number(raw);
      else payload[field] = raw === "" ? null : raw;
    });
    var btn = box.querySelector('[data-act="save"]');
    btn.disabled = true;
    try {
      await G.post("/answers/" + encodeURIComponent(id) + "/correction", payload);
      box.remove();
      G.toast("已保存纠正（只在人工层回显，不改自动指标）");
      await loadAnswerPage();  // 回显"已纠正"标记，必须重新取数
    } catch (e) {
      G.toast("保存纠正失败：" + e.message, "error");
      btn.disabled = false;
    }
  }

  // 一条回答的「标签区」：阅读视图与表格视图共用，避免两处各自维护导致口径分叉。
  function answerTags(a) {

  async function loadAnswerPage() {
    var listBox = $("ansList");
    if (!listBox) return;
    if (!state.trackerId || !state.questionId) {
      listBox.innerHTML = G.empty("该监控对象还没有问题");
      return;
    }
    var st = G.pagerInit("mon-answers", loadAnswerPage);
    state.answerPage = st.page;
    listBox.innerHTML = '<div class="empty">加载中…</div>';
    var d = await G.get("/trackers/" + state.trackerId + "/answers?" + datesF() +
      "&questionId=" + encodeURIComponent(state.questionId) + "&limit=" + PAGE_SIZE + "&page=" + st.page +
      "&citeView=" + encodeURIComponent(state.citeView));
    state.monitoringAvailable = d.monitoring_available === true;
    var total = (d.page && d.page.total) || 0;
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (st.page > pages) { st.page = pages; return loadAnswerPage(); }
    state.answers = d.items || [];
    state.answerTotal = total;
    state.answerPages = pages;
    var meta = $("ansMeta");
    if (meta) meta.textContent = total + " 条答案";

    if (!state.answers.length) {
      listBox.innerHTML = G.empty("该问题在当前周期没有有效答案");
      renderCitations(null);
      return;
    }
    if (!state.selectedAnswer || !state.answers.some(function (a) { return a.id === state.selectedAnswer; })) {
      state.selectedAnswer = state.answers[0].id;
    }
    listBox.innerHTML = (state.answerView === "table" ? renderAnswerTable() : renderAnswerReading()) +
      G.pagerNav("mon-answers", st.page, pages, total);
    listBox.dataset.page = String(st.page);

    renderCitations(state.answers.filter(function (a) { return a.id === state.selectedAnswer; })[0]);
  }

  function metricValueText(d) {
    if (d.status === "insufficient_samples") return "样本不足";
    if (d.metric === "sentiment" && d.distribution) {
      var x = d.distribution;
      return "正 " + fmtPct(x.pos) + " · 中 " + fmtPct(x.neu) + " · 负 " + fmtPct(x.neg);
    }
    if (d.metric === "mention_count") return G.num(d.value);
    if (d.metric === "avg_rank") return fmtNum(d.value);
    return fmtPct(d.value);

  // ---- 趋势折线 ----
  // 两个坑一起修：
  // 1) x 轴按真实日期等距，不按点序号——否则跳过一天后 11-05 和 11-07 被画成相邻，
  //    时间轴失真（原实现用 i*step）。
  // 2) 缺样本的日子不断开整条线，改用虚线段连过去；虚线 = 这段没有可用样本，
  //    而实线 = 有样本。既不编造 0%，也不会看着像线坏了。
  function trendSvg(points) {
    var W = 620, H = 150, pad = 10;
    var DAY_MS = 86400000;
    function dayNum(s) { return Date.parse(s) / DAY_MS; }
    var usable = points.filter(function (p) {
      return p.date && isFinite(dayNum(p.date)) &&
        p.mention_rate !== null && p.mention_rate !== undefined;
    });
    if (!usable.length) return G.empty("该周期没有可画的点");
    var max = Math.max.apply(null, usable.map(function (p) { return p.mention_rate; }));
    if (max <= 0) max = 1;

    var t0 = Math.min.apply(null, points.map(function (p) { return dayNum(p.date); }));
    var t1 = Math.max.apply(null, points.map(function (p) { return dayNum(p.date); }));
    var span = Math.max(1, t1 - t0);
    function xOf(p) { return pad + (dayNum(p.date) - t0) / span * (W - pad * 2); }
    function yOf(v) { return H - pad - (v / max) * (H - pad * 2); }

    var segs = [], prev = null;
    usable.forEach(function (p) {
      var x = xOf(p), y = yOf(p.mention_rate);
      if (prev !== null) {
        var gapDays = dayNum(p.date) - dayNum(prev.date);
        var isGap = gapDays > 1.5;  // 跨过了没样本的日子
        segs.push('<line x1="' + prev.x.toFixed(1) + '" y1="' + prev.y.toFixed(1) +
          '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) +
          '" stroke="' + (isGap ? "var(--muted)" : "var(--accent)") +
          '" stroke-width="2"' + (isGap ? ' stroke-dasharray="4 4"' : "") +
          ' stroke-linecap="round" />');
      }
      prev = { date: p.date, x: x, y: y };
    });
    return '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img">' +
      '<line x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) +
        '" stroke="var(--border)" stroke-width="1" />' +
      segs.join("") + "</svg>";
  }

        esc(text) + '</div><div class="s">' + esc(sub) + "</div></div>";
    };

      var max = rows.reduce(function (m, r) { return Math.max(m, r[countKey]); }, 1);

          ((r[countKey] / max) * 100).toFixed(1) + '%"></span></span>' +
          '<span class="val">' + G.num(r[countKey]) + "</span></div>";
      }).join("") + "</div>";

    box.innerHTML = '<div class="tab-pad">' +

      G.pagerNav("mon-cites", st.page, pages, total) + "</div>";

  // ---- 采集健康：计划应采 vs 实际已采。数据和「缺口清单」是同一套口径 ----
  // 失败告警在「未配计划」时也显示——采集失败是事实，不因为没计划就藏起来
  function failureAlertHtml(d) {
    var failure = d.failure || {};
    var fstatus = d.failure_status || "insufficient_data";
    var reasons = (d.failure_reasons || []).map(function (r) {
      return esc(r.code) + " " + G.num(r.count) + " 次" + (r.known ? "" : "（未知码）");
    }).join("、");
    var reasonLine = reasons
      ? '<div style="margin-top:6px">失败原因：' + reasons + "</div>"
      : "";
    if (fstatus === "over_threshold") {
      return '<div class="notice warn" style="margin:0 0 12px">' +
        "<strong>失败率超阈值</strong>：" + fmtPct(failure.rate) +
        "，高于 " + fmtPct(d.failure_threshold) +
        "。按原因处理：AUTH 类查 key，RATE_LIMITED 降频，TIMEOUT 调大超时。" +
        reasonLine + "</div>";
    }
    if (fstatus === "ok") {
      return '<div class="notice" style="margin:0 0 12px">采集失败率 ' +
        fmtPct(failure.rate) + "，在 " + fmtPct(d.failure_threshold) + " 阈值内。" +
        reasonLine + "</div>";
    }
    return '<div class="notice" style="margin:0 0 12px">本周期没有采集尝试，' +
      "失败率无从计算（不按 0% 处理）。</div>";
  }

  // 采集任务列表：真实 run 记录；runs 请求失败不拖垮整个健康页。
  async function loadRuns() {
    try {
      var d = await G.get("/trackers/" + state.trackerId + "/runs?" + datesF());
      return d.items || [];
    } catch (e) { return null; }

  function runsHtml(runs) {
    var head = '<div class="rule" style="margin-top:16px">采集任务' +
      (runs ? '（' + runs.length + ' 次）' : '') + "</div>";
    if (runs === null) {
      return head + '<div class="notice warn">采集任务列表暂时读取失败。</div>';
    }
    if (!runs.length) {
      return head + '<div class="empty">本周期尚无采集任务</div>';
    }
    var RUN_TEXT = { completed: "完成", failed: "失败", running: "进行中", queued: "排队中" };
    var rows = runs.map(function (r) {
      var prog = r.total ? (r.succeeded + r.failed) + "/" + r.total : "—";

      return "<tr><td>" + esc(when) + "</td>" +
        '<td><span class="tag ' + (r.status === "completed" ? "ok" : r.status === "failed" ? "bad" : "") + '">' +

        '<td class="num">' + G.num(r.succeeded) + "</td>" +
        '<td class="num">' + G.num(r.failed) + "</td></tr>";

    return head + '<div class="table-wrap"><table><thead><tr><th>排期时间</th><th>状态</th>' +

      '<label class="muted">操作人<br/><input id="intActor" type="text" placeholder="例：运营A" style="width:110px" /></label>' +
      '<button class="primary" id="intAdd">添加记录</button></div>' +
      '<div id="intList" style="margin-top:10px">' + list + "</div>" +
      '<div id="intState" class="muted" style="font-size:var(--fs-caption);margin-top:6px">' +
      esc(interventionState) + "</div>";
  }

  function bindIntervention() {
    var add = document.getElementById("intAdd");
    if (!add) return;
    add.addEventListener("click", async function () {
      var note = document.getElementById("intNote").value.trim();
      var actor = document.getElementById("intActor").value.trim();
      if (!note) { G.toast("请填写干预说明", "warn"); return; }
      var item = {
        type: document.getElementById("intType").value,
        note: note, actor: actor, at: new Date().toISOString(),
      };
      var next = interventions.concat([item]);
      try {
        await G.patch("/trackers/" + state.trackerId, { settings: { interventions: next } });
        interventions = next;
        interventionState = "已记录 " + new Date().toLocaleTimeString();
        preserveInterventionState = true;
        renderHealthTab();
      } catch (e) { G.toast("保存干预记录失败：" + e.message, "error"); }
    });
    var list = document.getElementById("intList");
    list.addEventListener("click", async function (e) {
      var btn = e.target.closest("[data-int-del]");
      if (!btn) return;
      var idx = Number(btn.dataset.intDel);
      var next = interventions.filter(function (_, i) { return i !== idx; });
      try {
        await G.patch("/trackers/" + state.trackerId, { settings: { interventions: next } });
        interventions = next;
        interventionState = "已删除 " + new Date().toLocaleTimeString();
        preserveInterventionState = true;
        renderHealthTab();
      } catch (err) { G.toast("删除失败：" + err.message, "error"); }
    });
  }

  async function loadInterventions() {
    try {
      var d = await G.get("/trackers/" + state.trackerId);
      var arr = d.settings && d.settings.interventions;
      interventions = Array.isArray(arr) ? arr : [];
    } catch (e) { interventions = []; }
    if (!preserveInterventionState) interventionState = "";
    preserveInterventionState = false;
  }

  async function renderHealthTab() {
    var results = await Promise.all([
      G.get("/trackers/" + state.trackerId + "/collection-health?" + datesF()),
      loadRuns(),
      loadInterventions(),
    ]);
    var d = results[0], runs = results[1];
    if (!d.configured) {
      $("tabBody").innerHTML = '<div class="tab-pad"><div class="notice warn">' +
        esc(d.message || "采样计划还没配置，无从计算应采数") +
        '<br />去 <a class="plain" href="/settings">设置</a> 配好采样计划与问题后，这里才有可比较的分母。</div>' +
        '<div style="height:12px"></div>' + failureAlertHtml(d) + runsHtml(runs) +
        interventionHtml() + "</div>";
      bindIntervention();
      return;
    }

    var tot = d.totals || {};
    var plan = d.plan || {};
    var kpi = function (label, value, sub) {
      return '<div class="kpi"><div class="k">' + esc(label) + "</div>" +
        '<div class="v">' + esc(value) + "</div>" +
        (sub ? '<div class="s">' + esc(sub) + "</div>" : "") + "</div>";
    };
    var rateBar = function (v) {
      return v === null || v === undefined
        ? "—"
        : '<span class="cmp-bar"><span style="width:' + (v * 100).toFixed(1) + '%"></span></span>';
    };
    var modelRows = (d.by_model || []).map(function (m) {
      return "<tr><td>" + G.modelBadge(m.model) + "</td>" +
        '<td class="num">' + G.num(m.expected) + "</td>" +
        '<td class="num">' + G.num(m.actual) + "</td>" +
        '<td class="num">' + G.num(m.missing) + "</td>" +
        '<td class="num">' + fmtPct(m.rate) + "</td>" +
        '<td style="width:180px">' + rateBar(m.rate) + "</td></tr>";
    }).join("");
    var dayRows = (d.by_day || []).map(function (m) {
      return "<tr><td>" + esc(m.date) + "</td>" +
        '<td class="num">' + G.num(m.expected) + "</td>" +
        '<td class="num">' + G.num(m.actual) + "</td>" +
        '<td class="num">' + G.num(m.missing) + "</td>" +
        '<td class="num">' + fmtPct(m.rate) + "</td></tr>";
    }).join("");

    var source = d.last_import_at
      ? "本周期最后一次导入：" + String(d.last_import_at).slice(0, 16).replace("T", " ")
      : "本周期没有导入批次（数据可能来自种子或更早的导入）";

    // T025 告警闭环：失败率来自与 config_service 共用的口径，三态各有说法。
    // 没采过不显示 0%——0/0 不是 0%，那会让人以为「很健康」。
    var failure = d.failure || {};
    var fstatus = d.failure_status || "insufficient_data";
    var fcard;
    if (fstatus === "insufficient_data") {
      fcard = kpi("采集失败率", "—", "本周期没有采集尝试");
    } else {
      fcard = kpi("采集失败率", fmtPct(failure.rate),
        G.num(failure.failed) + " / " + G.num(failure.attempted) + " 次失败");
    }
    var alert = failureAlertHtml(d);

    $("tabBody").innerHTML = '<div class="tab-pad">' +
      '<div class="kpis" style="padding:0 0 12px">' +
      kpi("应采", G.num(tot.expected), "计划 × 问题 × 模型 × 天数") +
      kpi("已采", G.num(tot.actual), "超出计划的部分不计入") +
      kpi("缺口", G.num(tot.missing), "可导出成待采清单") +
      kpi("达成率", fmtPct(tot.rate), "已采 ÷ 应采") +
      fcard +
      "</div>" + alert +
      '<div class="rule">计划：核心 ' + G.num(plan.core_times) + " 次/天 · 长尾 " +
      G.num(plan.long_tail_times) + " 次/天 · " + G.num(plan.question_count) +
      " 个启用问题 · " + (d.by_model || []).length + " 个模型 · 通道 " + esc(plan.channel || "—") + "</div>" +
      '<div class="table-wrap"><table><thead><tr><th>模型</th><th class="num">应采</th>' +
      '<th class="num">已采</th><th class="num">缺口</th><th class="num">达成率</th><th>对比</th>' +
      "</tr></thead><tbody>" + modelRows + "</tbody></table></div>" +
      '<div class="rule" style="margin-top:14px">按天</div>' +
      '<div class="table-wrap"><table><thead><tr><th>日期</th><th class="num">应采</th>' +
      '<th class="num">已采</th><th class="num">缺口</th><th class="num">达成率</th>' +
      "</tr></thead><tbody>" + dayRows + "</tbody></table></div>" +
      '<div class="note-line">' + esc(source) +
      " · 没有自动采集调度，缺口需人工补采：<code>python scripts/sample_gaps.py --export gaps.csv</code>" +
      "</div>" + runsHtml(runs) + interventionHtml() + "</div>";
    bindIntervention();
  }

  // 还没接数据的 tab：写清缺什么，不画假图。
  // 十个 tab 都已接数据；这里只兜住 URL 里出现的未知 tab（?tab=foo）。
  var TODO_TEXT = {};
  function renderTodo(key) {
    var info = TODO_TEXT[key] || [key, ""];
    $("tabBody").innerHTML = '<div class="todo"><div class="notice warn">' +
      esc(info[0]) + "：本批只搭好容器，还没有接数据。" +
      (info[1] ? "<br />" + esc(info[1]) : "") + "</div></div>";
  }

  var RENDER = {
    dashboard: renderDashboard,
    answers: renderAnswers,
    metrics: renderMetricsTab,
    trend: renderTrendTab,
    competitors: renderCompetitorsTab,
    sources: renderSourcesTab,

  };

  async function renderTab() {
    // 引用栏挂在工作台层级：只在问答明细 tab 展开，其余 tab 收起，避免看板被挤窄
    document.querySelector(".mon-grid").classList.toggle("with-cite", state.tab === "answers");
    loadTabCounts().catch(function () {});  // 数字与内容并行刷新，互不阻塞
    if (!state.trackerId) { $("tabBody").innerHTML = G.empty("先选择一个监控对象"); return; }
    $("tabBody").innerHTML = '<div class="empty">加载中…</div>';
    try {
      if (RENDER[state.tab]) await RENDER[state.tab]();
      else renderTodo(state.tab);
    } catch (e) {
      G.fail(e, ["tabBody"]);
    }
  }

  // ---- 事件 ----
  $("tabs").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-tab]");
    if (!btn || btn.dataset.tab === state.tab) return;

    syncUrl(true);
    renderTabs();
    renderTab();

  // 引用视图在第三栏顶部，不在 tabBody 里：切 tab 不会重建它，选中态留着
  $("citeView").addEventListener("change", function () {
    state.citeView = this.value;
    var url = new URL(location.href);
    url.searchParams.set("citeView", state.citeView);
    history.replaceState(null, "", url);
    if (state.tab === "answers") loadAnswerPage();
    else renderCitations(null);
  });

  // 问答明细点一条回答，第三栏换成它的引用；指标明细切指标。
  // 委托在 tabBody 上：tab 内容每次整体重建，逐个绑定会漏掉重建后的节点。
  $("tabBody").addEventListener("click", function (e) {
    // 复制要先拦住：它也在 [data-answer] 行内，不能冒成"选中这条回答"
    var cp = e.target.closest("[data-copy]");
    if (cp) {
      e.preventDefault();
      e.stopPropagation();
      copyAnswerText(cp.dataset.copy);
      return;
    }
    // P2：截图与纠正同为行内操作，都要先拦住，不能冒成"选中这条回答"
    var shot = e.target.closest("[data-shot]");
    if (shot) {
      e.preventDefault(); e.stopPropagation();
      shotAnswer(shot.dataset.shot);
      return;
    }
    var correct = e.target.closest("[data-correct]");
    if (correct) {
      e.preventDefault(); e.stopPropagation();
      openCorrectionForm(correct.dataset.correct);
      return;
    }
    var vb = e.target.closest("[data-view]");
    if (vb) {
      if (vb.dataset.view === state.answerView) return;
      state.answerView = vb.dataset.view;
      // 同步按钮高亮：只换数据不换 class，用户会以为点击没生效
      Array.prototype.forEach.call(document.querySelectorAll(".ans-view [data-view]"), function (b) {
        b.classList.toggle("on", b.dataset.view === state.answerView);
      });
      syncUrl(false);
      var old = $("ansList");
      if (old) {
        var page = Number(old.dataset.page || 1);
        // 只用已缓存的 state.answers 重渲染，不发请求——切换视图不该重新取数
        old.innerHTML = (state.answerView === "table" ? renderAnswerTable() : renderAnswerReading()) +
          G.pagerNav("mon-answers", page, state.answerPages, state.answerTotal);
        old.dataset.page = String(page);
      }
      return;
    }
    var ans = e.target.closest("[data-answer]");
    if (ans) {
      state.selectedAnswer = ans.dataset.answer;
      Array.prototype.forEach.call(document.querySelectorAll("#ansList [data-answer]"), function (el) {
        el.classList.toggle("sel", el === ans);
      });
      renderCitations(state.answers.filter(function (a) { return a.id === state.selectedAnswer; })[0]);
      return;
    }
    var mb = e.target.closest("[data-metric]");
    if (mb && state.tab === "metrics") {
      state.metric = mb.dataset.metric;
      G.pagerReset("mon-samples");
      renderTab();
      return;
    }
    var mt = e.target.closest("[data-media]");
    if (mt && state.tab === "media") {
      state.mediaType = mt.dataset.media;
      G.pagerReset("mon-media");
      renderTab();
      return;
    }
    var gb = e.target.closest("[data-granularity]");
    if (gb && state.tab === "trend") {
      state.granularity = gb.dataset.granularity;
      G.pagerReset("mon-trend");
      syncUrl(true);
      renderTab();
    }
  });

  // 切换监控对象＝切换品牌。左栏点击与品牌下拉共用，避免两份逻辑漂移。
  function switchTracker(id) {
    if (!id || id === state.trackerId) return;
    state.trackerId = id;
    $("tracker").value = id;
    // 问题列表属于旧对象，必须清空；模型和日期是可跨对象继承的筛选，保留。
    state.questionId = "";
    state.questions = [];
    state.filterQuestion = "";
    G.pagerReset("mon-answers");
    syncUrl(true);
    renderTrackerList();
    renderHead();
    syncFilterControls();
    loadTabCounts().catch(function (e) { G.fail(e, ["tabBody"]); });
    renderTab();
  }

  $("trackerList").addEventListener("click", function (e) {
    var el = e.target.closest("[data-tracker]");
    if (el) switchTracker(el.dataset.tracker);
  });

  $("brandFilter").addEventListener("change", function () {
    switchTracker(this.value);
  });

  $("questionFilter").addEventListener("change", function () {
    state.filterQuestion = this.value; applyFilters();
  });
  $("modelFilter").addEventListener("change", function () {
    state.filterModel = this.value; applyFilters();
  });
  $("clientFilter").addEventListener("change", function () {
    state.filterClient = this.value; applyFilters();
  });
  $("clearFilters").addEventListener("click", function () {
    state.filterQuestion = ""; state.filterModel = ""; state.filterClient = "";
    applyFilters();
  });
  ["from", "to"].forEach(function (id) {
    $(id).addEventListener("change", function () { syncFilterControls(); });
  });

  $("listSearch").addEventListener("input", renderTrackerList);
  // ---- E1e 新建抽屉：字段与校验和 settings.html 的 newForm 一致 ----
  var splitNames = function (v) {
    return (v || "").split(/[,，]/).map(function (x) { return x.trim(); }).filter(Boolean);
  };
  $("newTracker").addEventListener("click", async function () {
    $("ntError").innerHTML = "";
    $("newTrackerForm").reset();
    $("newDrawer").showModal();
    // 渠道是只读清单：只有注册了采集器的通道可勾，未接入的照实禁用标注，
    // 不画空图也不让用户以为选了就能采（决策009的诚实口径）。
    try {
      var meta = await G.get("/meta/channels");
      $("ntChannels").innerHTML = (meta.items || []).map(function (ch) {
        return '<label class="' + (ch.available ? '' : 'off') + '">' +
          '<input type="checkbox" ' + (ch.available ? 'checked' : 'disabled') + ' />' +
          esc(ch.label) + (ch.available ? '' : '（未接入）') + '</label>';
      }).join("");
    } catch (err) {
      $("ntChannels").textContent = "渠道清单暂时加载不到，可先创建对象";
    }
  });
  $("ntCancel").addEventListener("click", function () { $("newDrawer").close(); });
  $("newTrackerForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var body = {
      name: $("ntName").value.trim(),
      brand_name: $("ntBrand").value.trim(),
      website: $("ntWebsite").value.trim(),
      industry: $("ntIndustry").value.trim(),
      region: $("ntRegion").value.trim(),
      brand_aliases: splitNames($("ntAliases").value),
      competitor_names: splitNames($("ntCompetitors").value),
    };
    var keywords = splitNames($("ntKeywords").value);
    var questionText = $("ntQuestions").value.trim();
    try {
      // 三步串成一次「创建并继续」：建对象 → 写核心词 → 导入问题。
      // 任何一步失败都留在抽屉里、显示已做到哪步，不让用户以为全成了。
      var created = await G.post("/trackers", body);
      var id = created.id || created.tracker_id;
      if (keywords.length) {
        try { await G.patch("/trackers/" + id, { keywords: keywords }); }
        catch (ke) { throw new Error("对象已建，但核心词保存失败：" + ke.message); }
      }
      if (questionText) {
        try { await G.post("/trackers/" + id + "/questions", { text: questionText }); }
        catch (qe) { throw new Error("对象已建，但问题导入失败：" + qe.message); }
      }
      $("newDrawer").close();
      state.trackers.push(created);
      state.trackerId = created.id;
      state.questionId = "";
      state.questions = [];
      state.tabCounts = {};
      // 下拉的 option 只在 G.fillTrackers() 里生成；不重建就直接给新 id 设 value，
      // select 上没有对应 option 会静默变成空值——新建成功却切不到新对象。
      await G.fillTrackers();
      $("tracker").value = created.id;
      renderTrackerList();
      renderHead();
      await loadQuestions();
      syncUrl(true);
      renderTabs();
      await renderTab();
      G.toast("已创建；导入问题后才会产生采样");
    } catch (err) {
      // 校验错误就地显示，不跳页、不清空已填字段——重填一遍最烦人
      $("ntError").innerHTML = '<div class="notice error">创建失败：' + esc(err.message) + "</div>";
    }
  });
  $("refreshBtn").addEventListener("click", function () { renderTab(); });
  // 「表格浏览」直达问答明细的表格视图——与 tab 内的阅读/表格切换同一份状态。
  $("tableBrowseBtn").addEventListener("click", function () {
    state.tab = "answers";
    state.answerView = "table";
    syncUrl(true);
    renderTabs();
    renderTab();
  });
  $("load").addEventListener("click", function () { renderTab(); });

  // ---- 对象头按钮组 ----

  // 导出：直接走浏览器下载，不用 fetch——文件可能几万行，塞进内存再拼 Blob 没必要
  $("exportBtn").addEventListener("click", function () {
    if (!state.trackerId) return;

  $("reportBtn").addEventListener("click", async function () {

    // 报告要算环比，日期范围必须有跨度；同一天生成不出「不可比」以外的结论
    if (!from || !to || from >= to) {

  $("pauseBtn").addEventListener("click", async function () {

  // 删除或新建后重拉列表：不能只从 state 里 splice，问题数、状态都可能已变
  async function reloadTrackers() {
    var d = await G.get("/trackers");
    state.trackers = d.items || [];
    await G.fillTrackers();
    if (!state.trackers.some(function (x) { return x.id === state.trackerId; })) {
      state.trackerId = state.trackers.length ? state.trackers[0].id : "";
      state.questionId = "";
      state.questions = [];
      $("tracker").value = state.trackerId;
    }
    syncUrl(true);
    renderTrackerList();
    renderHead();

    renderTab();

  window.addEventListener("popstate", function () {

    state.tab = q.tab;
    state.granularity = q.granularity;
    state.citeView = q.citeView;
    state.answerView = q.answerView;
    state.filterQuestion = q.filterQuestion;
    state.filterModel = q.filterModel;
    state.filterClient = q.filterClient;
    syncFilterControls();
    if ($("citeView")) $("citeView").value = state.citeView;
    if (q.tracker && q.tracker !== state.trackerId) {
      state.trackerId = q.tracker;
      $("tracker").value = state.trackerId;
      state.questionId = "";
      state.questions = [];
    }
    renderTrackerList();
    renderHead();
    renderTabs();
    renderTab();
  });

  (async function init() {
    var q = readQuery();
    state.tab = q.tab;
    state.granularity = q.granularity;
    state.citeView = q.citeView;
    state.answerView = q.answerView;
    state.filterQuestion = q.filterQuestion;
    state.filterModel = q.filterModel;
    state.filterClient = q.filterClient;
    syncFilterControls();
    if ($("citeView")) $("citeView").value = state.citeView;
    await G.fillTrackers();
    try {
      var d = await G.get("/trackers");
      state.trackers = d.items || [];
    } catch (e) {
      $("trackerList").innerHTML = '<div class="notice error">读取监控列表失败：' + esc(e.message) + "</div>";
      return;
    }
    var wanted = q.tracker && state.trackers.some(function (t) { return t.id === q.tracker; })
      ? q.tracker
      : (state.trackers[0] ? state.trackers[0].id : "");
    state.trackerId = wanted;
    if (wanted) $("tracker").value = wanted;
    renderTrackerList();
    renderHead();
    await loadQuestions();
    renderTabs();
    syncUrl(false);
    if (!wanted) { $("tabBody").innerHTML = G.empty("还没有监控对象"); return; }
    await renderTab();
  })();

  // P2 纠正弹层的按钮不在 tabBody 里（挂 body 上），单独委托一次。
  document.addEventListener("click", function (e) {
    var box = e.target.closest(".correction-form");
    if (!box) {
      // 点弹层外面：关闭而不保存。纠正弹层不是模态，关掉不该写任何东西。
      var open = document.querySelector(".correction-form");
      if (open && !e.target.closest("[data-correct]")) open.remove();
      return;
    }
    var act = e.target.closest("[data-act]");
    if (!act) return;
    if (act.dataset.act === "cancel") box.remove();
    else if (act.dataset.act === "save") saveCorrection(box);
  });
})();
</script>
</body>
</html>
